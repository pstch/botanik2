# blocks.toml - the library blocks that are NOT POUs.
#
# utils/ holds the ones a program may name in its network without them being
# part of the IEC vocabulary: this one is a filter, not a function block, and
# it has no reference page. Declared here so a network can be checked against
# its pins like any other.

[ExpMovingAverage]
header = "utils/filters.h"
brief  = "an average that forgets, sampled when the law says"
in     = ["x", "push"]
out    = ["out"]
