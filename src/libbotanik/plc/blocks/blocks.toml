# blocks.toml - the LIBRARY's function blocks: what each presents, and
# what it does inside.
#
# The report draws from this; a site declares its own the same way in
# src/sites/<name>/blocks/. `in` and `out` are the pin names the network
# tables are checked against. `inside` is the reference page: a `kind`
# the report knows how to draw, and the data for it.

[Ton]
header = "timers.h"
brief  = "IEC TON, on-delay"
in     = ["in", "delay_ms", "dt"]
out    = ["q"]
notes  = [
  "q goes true once in has held true for delay_ms, and false the moment in drops.",
  "elapsed_ms() saturates at the delay, so it reads as a \"starting in N s\" countdown and never runs away.",
  "Used for: a contact debounce (dc_watch), a generator's cranking time (ac_local_watch), a state dwell (irrigation).",
]
[Ton.inside]
kind = "timing"
marks = [[0.15, "in rises"], [0.45, "+delay"], [0.75, "in drops"]]
traces = [
  ["in", [[0.15, 0], [0.75, 1], [1.0, 0]]],
  ["q", [[0.45, 0], [0.75, 1], [1.0, 0]]],
]

[Tof]
header = "timers.h"
brief  = "IEC TOF, off-delay"
in     = ["in", "delay_ms", "dt"]
out    = ["q"]
notes  = [
  "q follows in UP immediately and holds true for delay_ms after it drops. A minimum run time, or an overrun.",
  "Used for: the rain lockout outliving the shower (roof_lockout), the rot lockout's release (humidity).",
]
[Tof.inside]
kind = "timing"
marks = [[0.15, "in rises"], [0.5, "in drops"], [0.8, "+delay"]]
traces = [
  ["in", [[0.15, 0], [0.5, 1], [1.0, 0]]],
  ["q", [[0.15, 0], [0.8, 1], [1.0, 0]]],
]

[Tp]
header = "timers.h"
brief  = "IEC TP, pulse"
in     = ["in", "width_ms", "dt"]
out    = ["q"]
notes  = [
  "A rising in starts a pulse of exactly width_ms, and the pulse RUNS TO COMPLETION whatever in does next - a second edge inside it is ignored.",
  "Used for: nothing now. The thermal screen's traverse was a Tp until the fabric became a Plc::Actuator, which times the stroke and knows where it ended.",
]
[Tp.inside]
kind = "timing"
marks = [[0.15, "rising edge"], [0.55, "+width"]]
traces = [
  ["in", [[0.15, 0], [0.3, 1], [0.62, 0], [0.68, 1], [1.0, 0]]],
  ["q", [[0.15, 0], [0.55, 1], [1.0, 0]]],
]

["RTrig / FTrig"]
header = "logic.h"
brief  = "IEC R_TRIG / F_TRIG, edge detectors"
in     = ["in"]
out    = ["q"]
notes  = [
  "True for exactly ONE activation, on the edge. e = in && !prev for RTrig; e = !in && prev for FTrig.",
  "An edge detector in front of a signal that is already one scan wide adds nothing - which is why the screen lost one.",
]
["RTrig / FTrig".inside]
kind = "timing"
marks = [[0.15, "rise"], [0.55, "fall"]]
traces = [
  ["in", [[0.15, 0], [0.55, 1], [1.0, 0]]],
  ["RTrig", [[0.15, 0], [0.21, 1], [1.0, 0]]],
  ["FTrig", [[0.55, 0], [0.61, 1], [1.0, 0]]],
]

["Sr / Rs"]
header = "logic.h"
brief  = "IEC SR / RS, the two latches"
in     = ["set", "reset"]
out    = ["q"]
notes  = [
  "Sr is SET-dominant: q = set || (q && !reset). Both true, and it latches.",
  "Rs is RESET-dominant: q = !reset && (set || q). Both true, and it drops. Pick the one whose dominant input is the safe one - a lockout that must clear on recovery is an Rs.",
]
["Sr / Rs".inside]
kind = "states"
states = [["q = false", "at rest"], ["q = true", "latched"]]
edges = [
  ["q = false", "q = true", "set"],
  ["q = true", "q = false", "reset"],
]

[Hysteresis]
header = "analog.h"
brief  = "a band with two edges"
in     = ["value", "low", "high"]
out    = ["q"]
notes  = [
  "q goes true at high and false at low, and NOTHING happens in between: a reading sitting on one threshold cannot chatter.",
  "The two curves never meet between low and high: which one the block is on is the state it keeps.",
  "Used for: the intake gates (cooling), the dryness gate (humidity).",
]
[Hysteresis.inside]
kind = "curve"
xlab = "value"
ylab = "q"
points = [[0.0, 0.05], [0.55, 0.05], [0.55, 0.9], [1.0, 0.9]]
down = [[1.0, 0.9], [0.3, 0.9], [0.3, 0.05], [0.0, 0.05]]
marks = [[0.3, "low"], [0.55, "high"]]

[Hysteresis3]
header = "analog.h"
brief  = "three bands, one reading"
in     = ["value", "low", "high", "hyst"]
out    = ["band"]
notes  = [
  "Two thresholds, each with its own hysteresis, giving three levels. A level change needs the reading to cross a whole band.",
]
[Hysteresis3.inside]
kind = "curve"
xlab = "value"
ylab = "level"
points = [[0.0, 0.05], [0.3, 0.05], [0.3, 0.45], [0.62, 0.45], [0.62, 0.85], [1.0, 0.85]]
down = [[1.0, 0.85], [0.46, 0.85], [0.46, 0.45], [0.14, 0.45], [0.14, 0.05], [0.0, 0.05]]
marks = [[0.14, "e1 - hyst"], [0.3, "edge 1"], [0.46, "e2 - hyst"], [0.62, "edge 2"]]

[Staircase3]
header = "analog.h"
brief  = "three rungs, each hysteretic"
in     = ["value", "edge1", "edge2", "edge3", "hyst"]
out    = ["level"]
notes  = [
  "One Hysteresis per rung, each engaging at its edge and releasing at edge - hyst. Returns how many rungs the reading is above.",
  "Used for: the fan speeds and the destratification bands - which is why a demand sitting on a rung does not step the relays.",
]
[Staircase3.inside]
kind = "curve"
xlab = "value"
ylab = "level 0..3"
points = [[0.0, 0.03], [0.22, 0.03], [0.22, 0.35], [0.5, 0.35], [0.5, 0.66], [0.78, 0.66], [0.78, 0.97], [1.0, 0.97]]
down = [[1.0, 0.97], [0.64, 0.97], [0.64, 0.66], [0.36, 0.66], [0.36, 0.35], [0.08, 0.35], [0.08, 0.03], [0.0, 0.03]]
marks = [[0.08, "- hyst"], [0.22, "edge1"], [0.36, "- hyst"], [0.5, "edge2"], [0.64, "- hyst"], [0.78, "edge3"]]

[Ramp]
header = "analog.h"
brief  = "IEC RAMP, a rate limiter"
in     = ["target", "rate_per_s", "dt"]
out    = ["out"]
notes  = [
  "The output moves toward the target by at most rate_per_s, so a step demand becomes a slope the mechanics can follow.",
  "preset() jumps without ramping, for a mode change.",
]
[Ramp.inside]
kind = "curve"
xlab = "time"
ylab = "out"
points = [[0.0, 0.1], [0.12, 0.1], [0.62, 0.85], [1.0, 0.85]]
marks = [[0.12, "target steps"]]

[Deadband]
header = "analog.h"
brief  = "report only a real move"
in     = ["value", "band"]
out    = ["out"]
notes  = [
  "Holds the last reported figure until the input has moved more than band from it, then adopts the new one whole.",
  "Suppresses jitter without lagging a real change - a meter's last digit is not a telemetry publish and not a register write.",
]
[Deadband.inside]
kind = "curve"
xlab = "value"
ylab = "reported"
points = [[0.0, 0.2], [0.28, 0.2], [0.28, 0.5], [0.66, 0.5], [0.66, 0.8], [1.0, 0.8]]
down = [[1.0, 0.8], [0.5, 0.8], [0.5, 0.5], [0.12, 0.5], [0.12, 0.2], [0.0, 0.2]]
marks = [[0.12, "-band"], [0.28, "+band"], [0.5, "-band"], [0.66, "+band"]]

[Ewma]
header = "filters.h"
brief  = "an exponential average, against dt"
in     = ["x", "tau_s", "dt"]
out    = ["out"]
notes  = [
  "Filtered against the REAL dt, not a fixed blend: a program due late runs once with the whole elapsed time, and a constant alpha would silently change the time constant when the scan slipped.",
  "Used for: the probe zones, the DC rail averages, the outlet flow.",
]
[Ewma.inside]
kind = "flow"
cols = [
  [["value", "the reading", "in"]],
  [["alpha", "dt / (tau + dt)", "var"]],
  [["state", "s += alpha * (value - s)", "block"]],
  [["out", "s", "out"]],
]
wires = [
  ["value", "state", ""],
  ["alpha", "state", ""],
  ["state", "out", ""],
]

[MedianOf3]
header = "filters.h"
brief  = "the middle of three"
in     = ["x"]
out    = ["out"]
notes  = [
  "One spike cannot move the answer, which is what a median buys over a mean. Stateless.",
]
[MedianOf3.inside]
kind = "flow"
cols = [
  [["a", "", "in"], ["b", "", "in"], ["c", "", "in"]],
  [["sort", "drop high and low", "block"]],
  [["out", "the middle one", "out"]],
]
wires = [
  ["a", "sort", ""],
  ["b", "sort", ""],
  ["c", "sort", ""],
  ["sort", "out", ""],
]

["MovingAverage<N>"]
header = "filters.h"
brief  = "the last N samples, evenly weighted"
in     = ["x"]
out    = ["out"]
notes  = [
  "Every sample counts the same, and one leaves the window entirely - where an Ewma's oldest reading only ever fades.",
  "Fixed storage: N floats, no allocation.",
]
["MovingAverage<N>".inside]
kind = "flow"
cols = [
  [["value", "", "in"]],
  [["ring", "N slots, oldest overwritten", "block"]],
  [["out", "sum / count", "out"]],
]
wires = [
  ["value", "ring", ""],
  ["ring", "out", ""],
]

[Integral]
header = "meter.h"
brief  = "a rate becomes a total"
in     = ["rate_per_s", "dt", "cutoff"]
out    = ["total"]
notes  = [
  "The cutoff is a LIVE ZERO: a 4-20 mA loop sitting on its own noise would otherwise totalize a plausible volume with every valve shut.",
  "The total is a double - a float loses a small rate against a large total, which is exactly what a meter does all day.",
]
[Integral.inside]
kind = "flow"
cols = [
  [["rate_per_s", "", "in"], ["cutoff", "", "in"]],
  [["gate", "|rate| < cutoff -> 0", "block"]],
  [["accumulate", "total += rate * dt", "block"]],
  [["total", "double, so it does not lose the small ones", "out"]],
]
wires = [
  ["rate_per_s", "gate", ""],
  ["cutoff", "gate", ""],
  ["gate", "accumulate", ""],
  ["accumulate", "total", ""],
]

[Derivative]
header = "meter.h"
brief  = "a total becomes a rate"
in     = ["quantity", "window_ms", "dt"]
out    = ["rate"]
notes  = [
  "Over the time ACTUALLY accumulated, not the nominal window: a late scan overshoots it, and dividing by the nominal figure would report a rate that never happened.",
  "Between windows the last rate stands rather than reading zero.",
]
[Derivative.inside]
kind = "flow"
cols = [
  [["quantity", "", "in"], ["window_ms", "", "in"]],
  [["wait", "until elapsed >= window", "block"]],
  [["divide", "(q - prev) / elapsed", "block"]],
  [["rate", "held between windows", "out"]],
]
wires = [
  ["quantity", "wait", ""],
  ["window_ms", "wait", ""],
  ["wait", "divide", ""],
  ["divide", "rate", ""],
]

[Pid]
header = "pid.h"
brief  = "hold a reading at a setpoint"
in     = ["sp", "pv", "tuning", "dt"]
out    = ["out"]
notes  = [
  "Three departures from the textbook sum, all affecting tuning:",
  "- DERIVATIVE ON THE MEASUREMENT, not the error: a typed setpoint does not slam the output.",
  "- CONDITIONAL INTEGRATION: the integral stops accumulating while the output is saturated, so there is no back-calculation gain to tune.",
  "- The integral is clamped to the OUTPUT span, so it cannot wind up somewhere the actuator could never follow.",
  "preset() forces the output and makes the integral carry it, for a bumpless hand-back from manual.",
]
[Pid.inside]
kind = "flow"
cols = [
  [["sp", "setpoint", "in"], ["pv", "the reading", "in"]],
  [["error", "sp - pv, sign-corrected", "block"]],
  [["P", "kp * error", "block"], ["I", "+= ki * error * dt", "block"], ["D", "-kd * d(pv)/dt", "block"]],
  [["sum", "P + I + D", "block"]],
  [["clamp", "out_min .. out_max", "out"]],
]
wires = [
  ["sp", "error", ""],
  ["pv", "error", ""],
  ["error", "P", ""],
  ["error", "I", ""],
  ["pv", "D", ""],
  ["P", "sum", ""],
  ["I", "sum", ""],
  ["D", "sum", ""],
  ["sum", "clamp", ""],
]

[Actuator]
header = "actuator.h"
brief  = "two coils, no feedback, a position ESTIMATE"
in     = ["target", "cfg", "dt"]
out    = ["position", "moving", "open", "close"]
notes  = [
  "CLOSED means ON THE SEAT, which only a stroke to the closed end produces. Anything else at rest is OPEN, with position() for the detail: a claim about the seal, not a number.",
  "From UNKNOWN it drives to whichever end the target is nearer and datums there, and that stroke is COMMITTED - it cannot be interrupted, because a half-finished datum knows nothing.",
  "Enforced: the coils are never both energised; a reversal passes through reverse_ms with both dropped (a contactor that makes before the other breaks shorts the motor); a move under min_run_ms is not made at all.",
  "The estimate drifts, because nothing between the stops can correct it. Past redatum_travel the next PARTIAL move detours to the closed seat first and buys a known position for one stroke.",
  "Used for: the four roof windows, and the thermal screen - which PRESETS rather than datums, because its coil is held and deploys de-energised, so a released coil already says where the fabric is.",
]
[Actuator.inside]
kind = "states"
states = [["UNKNOWN", "no datum yet"], ["OPENING", "open coil"], ["OPEN", "off the seat"], ["CLOSING", "close coil"], ["CLOSED", "on the seat"]]
edges = [
  ["UNKNOWN", "OPENING", "target high"],
  ["UNKNOWN", "CLOSING", "target low"],
  ["OPENING", "OPEN", "stroke ends"],
  ["OPEN", "CLOSING", "target below"],
  ["CLOSING", "CLOSED", "reaches the seat"],
  ["CLOSED", "OPENING", "target above"],
]
