name   = "irr_meters"
class  = "WaterMeters"
task   = "SLOW"
health = "prog_irr_meters"
desc   = "Both water meters, and the two supply faults they can see."
notes  = """
Opposite instruments: the inlet is a pulse train, so its COUNTER is the
measurement and the rate is derived; the outlet is a 4-20 mA loop, so its
RATE is. An instrument, not a law - it drives no valve and it reads while
parked.
"""
hooks  = ["observe"]

[var.in_base_L]
type = "float"
init = "0.0f"
doc  = """
Where the inlet counter stood when this run adopted it: the pulse counter
restarts at boot and the published total does not, so the total is the
retained value plus what has been counted since.
"""

[var.in_base_pulses]
type = "uint32_t"
init = "0"

[fn.supply_alarms]
type = "void (float in_flow_Lpm, uint32_t dt_ms)"
doc  = """
Water moving with every valve shut, and water not arriving with the inlet
open. Both are read off the inlet meter alone.
"""

[block.flow_avg]
type = "Ewma"
doc  = "the loop, averaged over irr_out_avg_ms"

[block.flow_band]
type = "Deadband"
doc  = "...and how far it must move to be written"

[block.in_rate]
type = "Derivative"
doc  = "litres -> Lpm, over a window"

[block.idle_for]
type = "Ton"
doc  = """
One whole rate window in the state being judged, before either supply alarm
is allowed an opinion: the rate HOLDS its last completed window, so for
irr_rateWin_ms after a state change it is still reporting the state before.
"""

[block.fill_for]
type = "Ton"

[block.out_meter]
type = "Integral"
doc  = "Lpm -> litres"

[in]
band          = "irr_flowBand_Lpm"
cutoff        = "irr_flowCutoff_Lpm"
rate_win      = "irr_rateWin_ms"
out_flow      = "irr_out_Lpm"
out_avg_ms    = "irr_out_avg_ms"
qty_per_pulse = "irr_input_qtyPerImp"
leak_Lpm      = "irr_leak_Lpm"
min_fill_Lpm  = "irr_minFill_Lpm"
state         = "irr_state"

[out]
in_flow      = "irr_inFlow_Lpm"
in_total     = "irr_inTotal_L"
out_flow_pub = "irr_outFlow_Lpm"
out_total    = "irr_outTotal_L"
leak         = "alarm_water_leak"
pressure     = "alarm_water_pressure"

# The law as a network. The OUTLET is a flow meter averaged, deadbanded and
# integrated; the INLET is a pulse counter differentiated back into a rate. The
# two dwells are what let a reading mean something: a flow with every valve
# shut is a leak, and no flow while filling is no pressure.

[net.flow_avg]
[net.flow_avg.in]
x     = "out_flow"
tau_s = "out_avg_ms"
dt    = "=c.dt_ms"

[net.flow_band]
[net.flow_band.in]
value = "flow_avg.out"
band  = "band"
[net.flow_band.out]
out = "out_flow_pub"

[net.out_meter]
[net.out_meter.in]
rate_per_s = "=flow_avg.out / 60"
dt         = "=c.dt_ms"
cutoff     = "cutoff"
[net.out_meter.out]
total = "out_total"

[net.in_rate]
[net.in_rate.in]
quantity  = "in_total"
window_ms = "rate_win"
dt        = "=c.dt_ms"
[net.in_rate.out]
rate = "in_flow"

[net.idle_for]
[net.idle_for.in]
in       = "=state == IRR_IDLE"
delay_ms = "=2 * rate_win"
dt       = "=c.dt_ms"

[net.leaking]
fn = "and_of"
[net.leaking.in]
in1 = "idle_for.q"
in2 = "=in_flow > leak_Lpm"
[net.leaking.out]
out = "leak"

[net.fill_for]
[net.fill_for.in]
in       = "=state == IRR_FILLING"
delay_ms = "=2 * rate_win"
dt       = "=c.dt_ms"

[net.starved]
fn = "and_of"
[net.starved.in]
in1 = "fill_for.q"
in2 = "=in_flow < min_fill_Lpm"
[net.starved.out]
out = "pressure"
