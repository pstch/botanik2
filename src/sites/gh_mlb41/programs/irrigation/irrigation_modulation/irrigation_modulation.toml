name   = "irr_modulation"
class  = "IrrigationModulation"
task   = "SLOW"
health = "prog_irr_modulation"
desc   = "The irrigation ladder: how thirsty the air has been, as one factor."
notes  = """
Evaporation in, a modulation factor out. It commands nothing, so all of it
is in observe(), and it keeps folding while the plant is parked: an outage
is not a dry spell.
"""
hooks  = ["observe"]

[var.seeded]
type = "bool"
init = "false"

[fn.track_dryness]
type = "float (ProgramContext& c)"
doc  = """
Fold the VPD into the dryness average, at most once an hour. @return the
average now in force
"""

[block.fold]
type = "Ton"
doc  = "one hour, self-reset: when the dryness average takes a sample"

[block.dryness]
type = "Utils::ExpMovingAverage"
doc  = "the dryness tracker"

[in]
vpd       = "cli_vpd_kPa"
dry_days  = "irr_dryEwmaDays"
dry_lo    = "irr_dryLo_kPa"
dry_hi    = "irr_dryHi_kPa"
mod_min   = "irr_modMin"
mod_gamma = "irr_modGamma"

[out]
vpd_avg = "irr_vpdAvg_kPa"
mod     = "irr_mod"

# The law as a network. The hour timer is what makes the average take a
# sample, so it wires into the block rather than sitting beside it.

[net.fold]
[net.fold.in]
in       = "=true"
delay_ms = "=3600000"
dt       = "=c.dt_ms"

[net.dryness]
[net.dryness.in]
x    = "vpd"
push = "fold.q"
[net.dryness.out]
out = "vpd_avg"
