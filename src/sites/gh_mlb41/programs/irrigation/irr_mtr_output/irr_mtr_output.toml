name   = "irr_mtr_output"
class  = "IrrMtrOutput"
task   = "SLOW"
health = "prog_irr_mtr_output"
desc   = "The outlet meter: what came back off the trays."
notes  = """
A 4-20 mA loop, so the RATE is the measurement and the total is integrated -
the opposite of the inlet, which is why the two are separate programs.
"""
hooks  = ["observe"]

[block.flow_avg]
type = "Ewma"
doc  = "the loop's own last digit, averaged out"

[block.flow_band]
type = "Deadband"
doc  = "how far a flow has to move to be worth a write"

[block.meter]
type = "Integral"
doc  = "the totalizer, counting litres per second"

[in]
band       = "irr_flowBand_Lpm"
cutoff     = "irr_flowCutoff_Lpm"
out_flow   = "irr_out_Lpm"
out_avg_ms = "irr_out_avg_ms"

[out]
out_flow_pub = "irr_outFlow_Lpm"
out_total    = "irr_outTotal_L"

# The law as a network: averaged, deadbanded onto the published row, and
# integrated into the totalizer beside it.

[net.flow_avg]
[net.flow_avg.in]
x     = "out_flow"
tau_s = "out_avg_ms"
dt    = "=c.dt_ms"

[net.flow_band]
[net.flow_band.in]
value = "flow_avg.out"
band  = "band"
[net.flow_band.out]
out = "out_flow_pub"

# Per SECOND into the totalizer, which is what the block counts in.
[net.per_second]
fn = "div"
[net.per_second.in]
in1 = "flow_avg.out"
in2 = "=60"

[net.meter]
[net.meter.in]
rate_per_s = "per_second.out"
dt         = "=c.dt_ms"
cutoff     = "cutoff"
[net.meter.out]
total = "out_total"
