name   = "irr_mtr_input"
class  = "IrrMtrInput"
task   = "SLOW"
health = "prog_irr_mtr_input"
desc   = "The inlet meter, and the two supply faults it alone can see."
notes  = """
A PULSE TRAIN, so the COUNTER is the measurement and the rate is derived -
the opposite of the outlet, which is why the two are separate programs. An
instrument, not a law: it drives no valve and it reads while parked.
"""
hooks  = ["observe"]

[var.base_L]
type = "float"
init = "0.0f"
doc  = """
Where the counter stood when this run adopted it: the pulse counter restarts
at boot and the published total does not, so the total is the retained value
plus what has been counted since.
"""

[var.base_pulses]
type = "uint32_t"
init = "0"

[block.rate]
type = "Derivative"
doc  = "litres counted, differenced back into a rate"

[block.idle_for]
type = "Ton"
doc  = "two rate windows of IDLE before a flow means a leak"

[block.fill_for]
type = "Ton"
doc  = "two rate windows of FILLING before no flow means no pressure"

[in]
rate_win      = "irr_rateWin_ms"
qty_per_pulse = "irr_input_qtyPerImp"
leak_Lpm      = "irr_leak_Lpm"
min_fill_Lpm  = "irr_minFill_Lpm"
state         = "irr_state"

[out]
in_flow  = "irr_inFlow_Lpm"
in_total = "irr_inTotal_L"
leak     = "alarm_water_leak"
pressure = "alarm_water_pressure"

# The law as a network: a counter differenced into a rate, and the two faults
# that rate means once the state has held long enough to be believed.

[net.rate]
[net.rate.in]
quantity  = "in_total"
window_ms = "rate_win"
dt        = "=c.dt_ms"
[net.rate.out]
rate = "in_flow"

[net.idle_for]
[net.idle_for.in]
in       = "=state == IRR_IDLE"
delay_ms = "=2 * rate_win"
dt       = "=c.dt_ms"

[net.leaking]
fn = "and_of"
[net.leaking.in]
in1 = "idle_for.q"
in2 = "=in_flow > leak_Lpm"
[net.leaking.out]
out = "leak"

[net.fill_for]
[net.fill_for.in]
in       = "=state == IRR_FILLING"
delay_ms = "=2 * rate_win"
dt       = "=c.dt_ms"

[net.starved]
fn = "and_of"
[net.starved.in]
in1 = "fill_for.q"
in2 = "=in_flow < min_fill_Lpm"
[net.starved.out]
out = "pressure"
