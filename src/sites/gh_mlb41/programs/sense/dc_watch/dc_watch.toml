name   = "dc_watch"
class  = "DcWatch"
task   = "SLOW"
health = "prog_dc_watch"
desc   = """
The DC rails and the two batteries, watched - and the plant-wide lockout they
raise.
"""
notes  = """
`sys_supply_lockout` follows the UPS LOW-BATTERY CONTACT, not a voltage: the
UPS knows what its own battery has left and a divider on the rail does not.
The voltage floors are warning, not interlock.
"""
hooks  = ["observe"]

[var.seen]
type  = "bool"
count = "4"
init  = "{ false, false, false, false }"
doc   = "Per rail, whether its divider has EVER answered. @see AcSupply"

[var.safe_held]
type = "bool"
init = "false"
doc  = """
What this law last told the registry, so the plant-wide hold is pushed on the
EDGE and not walked over every task every beat.
"""

# One pair per rail, named for the rail it serves: the two power supplies, the
# UPS battery and the generator battery, which is what ps1_flt / ps2_flt /
# ups_flt / gen_flt call them too.

[block.ps1_mean]
type = "Ewma"
doc  = """
The rail is judged on the AVERAGE, so one noisy sample cannot raise a supply
fault. One per divider, each with its own time constant.
"""

[block.ps1_band]
type = "Deadband"
doc  = "...and how far the average must move to be worth a status write"

[block.ps2_mean]
type = "Ewma"

[block.ps2_band]
type = "Deadband"

[block.ups_mean]
type = "Ewma"

[block.ups_band]
type = "Deadband"

[block.gen_mean]
type = "Ewma"

[block.gen_band]
type = "Deadband"

[block.low_for]
type = "Ton"
doc  = "debounce: a contact bounces, a UPS does not"

[in]
dc1     = "pwr_dc1_V"
dc2     = "pwr_dc2_V"
ups_bat = "pwr_upsBat_V"
gen_bat = "pwr_genBat_V"
# One rolling average per divider: the rail is judged on the AVERAGE, so a
# single noisy sample cannot raise a supply fault.
dc1_avg = "pwr_dc1_avg_ms"
dc2_avg = "pwr_dc2_avg_ms"
ups_avg = "pwr_upsBat_avg_ms"
gen_avg = "pwr_genBat_avg_ms"
dc1_lo  = "pwr_dc1Lo_V"
dc2_lo  = "pwr_dc2Lo_V"
ups_lo  = "pwr_upsBatLo_V"
gen_lo  = "pwr_genBatLo_V"
low_bat = "pwr_upsLowBat"

[out]
out_dc1 = "sys_dc1_V"
out_dc2 = "sys_dc2_V"
out_ups = "sys_upsBat_V"
out_gen = "sys_genBat_V"
ok      = "sys_dc_ok"
lockout = "sys_supply_lockout"
ps1_flt = "alarm_dc_ps1"
ps2_flt = "alarm_dc_ps2"
ups_flt = "alarm_dc_ups"
gen_flt = "alarm_generator_battery"

# The law as a network: four rails, each averaged then deadbanded onto its
# status row. Each rail's fault is that average against its own floor, which is
# one comparison and stays inline. The UPS's low-battery CONTACT is separate
# from its volts - it is the one that parks the plant.

[net.ps1_mean]
[net.ps1_mean.in]
x     = "dc1"
tau_s = "dc1_avg"
dt    = "=c.dt_ms"

[net.ps1_band]
[net.ps1_band.in]
value = "ps1_mean.out"
band  = "=SUPPLY_V_BAND"
[net.ps1_band.out]
out = "out_dc1"

[net.ps2_mean]
[net.ps2_mean.in]
x     = "dc2"
tau_s = "dc2_avg"
dt    = "=c.dt_ms"

[net.ps2_band]
[net.ps2_band.in]
value = "ps2_mean.out"
band  = "=SUPPLY_V_BAND"
[net.ps2_band.out]
out = "out_dc2"

[net.ups_mean]
[net.ups_mean.in]
x     = "ups_bat"
tau_s = "ups_avg"
dt    = "=c.dt_ms"

[net.ups_band]
[net.ups_band.in]
value = "ups_mean.out"
band  = "=SUPPLY_V_BAND"
[net.ups_band.out]
out = "out_ups"

[net.gen_mean]
[net.gen_mean.in]
x     = "gen_bat"
tau_s = "gen_avg"
dt    = "=c.dt_ms"

[net.gen_band]
[net.gen_band.in]
value = "gen_mean.out"
band  = "=SUPPLY_V_BAND"
[net.gen_band.out]
out = "out_gen"

# The CONTACT, not the volts: it is what the UPS itself says, and it is what
# holds the plant.
[net.low_for]
[net.low_for.in]
in       = "low_bat"
delay_ms = "=2000"
dt       = "=c.dt_ms"
[net.low_for.out]
q = "ups_flt"
