name   = "weather_watch"
class  = "WeatherWatch"
task   = "SLOW"
health = "prog_weather_watch"
desc   = """
The weather station, watched: whether it is answering, and whether what it
says is a storm.
"""
notes  = """
It reads the roof's two lockouts rather than declaring a second pair of
thresholds beside them: a storm alarm that disagreed with the actuator it is
about would be worse than no alarm.
"""
hooks  = ["observe"]

[var.seen]
type = "bool"
init = "false"
doc  = """
Whether the station has EVER answered. Before it has, silence is bring-up;
after, it is a fault. @see AcSupply
"""

[var.dry_ms]
type = "uint64_t"
init = "0"
doc  = """
Ms since the gauge last read wet, and whether it ever has in this run. A boot
does not know when it last rained, so before the first shower the row is held
rather than reading "just now".
"""

[var.wet_seen]
type = "bool"
init = "false"

[in]
wind      = "cli_wind_mps"
gust      = "cli_windGust_mps"
rain      = "cli_rain_mmph"
irrad     = "cli_irrad_Wpm2"
storm_wind = "cli_windShutEnd_mps"

[out]
station    = "alarm_wx_station"
storm      = "alarm_weather_storm"
since_rain = "cli_sinceRain_min"

# The law as a network. A station that has never answered is the bus still
# coming up; one that has and has stopped is the fault the windows are already
# shut for - which is the latch below. A STORM is the MEAN against one
# threshold, because a gust is a moment and a storm is a condition.

[net.station_flt]
fn = "and_of"
[net.station_flt.in]
in1 = "seen"
in2 = "=!wind.valid || !rain.valid"
[net.station_flt.out]
out = "station"

[net.storming]
fn = "ge"
[net.storming.in]
in1 = "wind"
in2 = "storm_wind"
[net.storming.out]
out = "storm"
