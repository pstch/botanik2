name   = "sun_watch"
class  = "SunWatch"
task   = "SLOW"
health = "prog_sun_watch"
desc   = "Where the sun is, published as rows."
notes  = """
The tracker is the firmware's; this turns it into rows, as the field-bus
client does for the probes. Everything downstream reads the rows, never the
instrument.
"""
hooks  = ["observe"]

[var.sun]
type     = "Sun::SunPositionTracker* const"
init     = "ctx.sun"
from_ctx = true
doc      = """
The instrument, borrowed: the firmware owns it, registers it and binds its geo
parameters. Null in a build without SUN_TRACKER, which is a build this program
is not in either.
"""

[out]
from_rise = "sol_fromRise_min"
from_set  = "sol_fromSet_min"
elevation = "sol_elev_deg"

# The law as a network: the tracker's three answers, put in the units a person
# reads and the phase table is declared in. Both offsets are one subtraction
# from the wall clock and the elevation is one conversion, so all three are
# inline - what this program does is READ the tracker, not compute.

[net.sun]
fn = "sel"
[net.sun.in]
g   = "=the tracker is ready"
in0 = "=held, nothing is published"
in1 = "=minutes either side of rise and set, and degrees"
[net.sun.out]
out = "elevation"
