name   = "temp_rh_zone"
class  = "TempRHZone"
task   = "FAST"
health = "prog_temp_rh_zone"
desc   = """
The psychrometrics every other law is set in, off the two interior levels:
one temperature for the house, and the worst case per quantity.
"""
notes  = """
Reads the conditioned rows temp_rh_sensors publishes, never a probe. The
worst case is taken among the levels that are MEASURED, so one holding a
reading from before its probes died does not speak for the house.
"""

[in]
temp_hi   = "cli_temp_hi"
rh_hi     = "cli_rh_hi"
temp_lo   = "cli_temp_lo"
rh_lo     = "cli_rh_lo"
rot_limit = "cli_rotMargin_degC"

[out]
temp_in   = "cli_temp_in"
dew_point = "cli_dewPoint_degC"
dp_margin = "cli_dpMargin_degC"
sat_press = "cli_satPress_kPa"
vpd       = "cli_vpd_kPa"
rot       = "alarm_rot"

# The law as a network: one temperature for the house, and one worst case per
# QUANTITY - the smallest margin for rot, the lowest VPD for irrigation, and
# they are not always the same level.

[net.hotter]
fn = "max_of"
[net.hotter.in]
in1 = "temp_hi"
in2 = "temp_lo"
[net.hotter.out]
out = "temp_in"

[net.margin_hi]
fn = "dew_point_margin"
[net.margin_hi.in]
t  = "temp_hi"
rh = "rh_hi"

[net.margin_lo]
fn = "dew_point_margin"
[net.margin_lo.in]
t  = "temp_lo"
rh = "rh_lo"

[net.margin]
fn = "min_of"
[net.margin.in]
in1 = "margin_hi.out"
in2 = "margin_lo.out"
[net.margin.out]
out = "dp_margin"

[net.rot_risk]
fn = "lt"
[net.rot_risk.in]
in1 = "dp_margin"
in2 = "rot_limit"
[net.rot_risk.out]
out = "rot"

[net.vpd_hi]
fn = "vapour_pressure_deficit"
[net.vpd_hi.in]
t  = "temp_hi"
rh = "rh_hi"

[net.vpd_lo]
fn = "vapour_pressure_deficit"
[net.vpd_lo.in]
t  = "temp_lo"
rh = "rh_lo"

[net.driest]
fn = "min_of"
[net.driest.in]
in1 = "vpd_hi.out"
in2 = "vpd_lo.out"
[net.driest.out]
out = "vpd"
