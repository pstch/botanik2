name   = "temp_rh_sensors"
class  = "TempRHSensors"
task   = "FAST"
health = "prog_temp_rh_sensors"
desc   = """
The four measurement locations, each voted down to one reading and filtered:
what the greenhouse IS, before any law is set in it.
"""
notes  = """
Runs FIRST, and nothing downstream reads a probe - they read the four
conditioned rows this publishes. Split from temp_rh_zone, which turns them
into the psychrometrics: this is the instrument, that is the derivation.
"""
hooks  = ["on_bind"]

# One per measurement location: three probes selected down to one reading,
# then filtered. Held by value so one zone's filter state cannot become
# another's.

[block.ceiling]
type    = "ZoneProbes"
include = "blocks/zone_probes.h"

[block.floor]
type    = "ZoneProbes"
include = "blocks/zone_probes.h"

[block.crawlspace]
type    = "ZoneProbes"
include = "blocks/zone_probes.h"

[block.exterior]
type    = "ZoneProbes"
include = "blocks/zone_probes.h"

[in]
tau_ms = { rows = "cli_sensorTau_ms" }
t_hi   = { rows = "cli_temp_hi*", count = 3 }
h_hi   = { rows = "cli_rh_hi*", count = 3 }
t_lo   = { rows = "cli_temp_lo*", count = 3 }
h_lo   = { rows = "cli_rh_lo*", count = 3 }
t_cs   = { rows = "cli_temp_cs*", count = 3 }
h_cs   = { rows = "cli_rh_cs*", count = 3 }
t_ext  = { rows = "cli_temp_ext*", count = 3 }
h_ext  = { rows = "cli_rh_ext*", count = 3 }

[out]
temp_hi   = "cli_temp_hi"
rh_hi     = "cli_rh_hi"
temp_lo   = "cli_temp_lo"
rh_lo     = "cli_rh_lo"
temp_cs   = "cli_temp_cs"
rh_cs     = "cli_rh_cs"
temp_ext  = "cli_temp_ext"
rh_ext    = "cli_rh_ext"
fault_hi  = "alarm_sns_ceiling"
fault_lo  = "alarm_sns_floor"
fault_cs  = "alarm_sns_crawlspace"
fault_ext = "alarm_sns_exterior"

# The law as a network: four locations, four blocks, and nothing between them.

[net.ceiling]
[net.ceiling.in]
t     = "t_hi"
h     = "h_hi"
tau_s = "tau_ms"
[net.ceiling.out]
temperature = "temp_hi"
humidity    = "rh_hi"
valid       = "fault_hi"

[net.floor]
[net.floor.in]
t     = "t_lo"
h     = "h_lo"
tau_s = "tau_ms"
[net.floor.out]
temperature = "temp_lo"
humidity    = "rh_lo"
valid       = "fault_lo"

[net.crawlspace]
[net.crawlspace.in]
t     = "t_cs"
h     = "h_cs"
tau_s = "tau_ms"
[net.crawlspace.out]
temperature = "temp_cs"
humidity    = "rh_cs"
valid       = "fault_cs"

[net.exterior]
[net.exterior.in]
t     = "t_ext"
h     = "h_ext"
tau_s = "tau_ms"
[net.exterior.out]
temperature = "temp_ext"
humidity    = "rh_ext"
valid       = "fault_ext"
