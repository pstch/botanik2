name   = "ac_grid_watch"
class  = "AcGridWatch"
task   = "SLOW"
health = "prog_ac_grid_watch"
desc   = "The utility feed, watched."
notes  = """
Empty run(), everything in observe(): an observation is exactly what has to
survive the plant being parked.
"""
hooks  = ["observe", "on_bind"]

# The supply block, bound from this program's own interface: the two supplies
# declare the same member names and one law reads either.

[block.supply]
type    = "AcSupply"
include = "blocks/ac_supply.h"

[in]
volts = "grid_LN_V"
amps  = "grid_total_A"
watts = "grid_total_W"
hz    = "grid_Hz"
lo_V  = "pwr_gridLo_V"
hi_V  = "pwr_gridHi_V"
lo_Hz = "pwr_gridLo_Hz"
hi_Hz = "pwr_gridHi_Hz"

[out]
out_V  = "sys_grid_V"
out_A  = "sys_grid_A"
out_W  = "sys_grid_W"
out_Hz = "sys_grid_Hz"
ok     = "sys_grid_ok"
fault  = "alarm_ac_grid"

# The generator-backed side, downstream of the transfer switch. Same members as
# the grid above, because AcSupply is bound from either by template.

# The law as a network: the block does all of it, and its eight inputs are the
# four meter reads and the four bands they are judged against.

[net.supply]
[net.supply.in]
volts = "volts"
amps  = "amps"
watts = "watts"
hz    = "hz"
lo_V  = "lo_V"
hi_V  = "hi_V"
lo_Hz = "lo_Hz"
hi_Hz = "hi_Hz"
[net.supply.out]
out_V  = "out_V"
out_A  = "out_A"
out_W  = "out_W"
out_Hz = "out_Hz"
ok     = "ok"
fault  = "fault"
