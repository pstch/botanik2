name   = "climate_watch"
class  = "ClimateWatch"
task   = "SLOW"
health = "prog_climate_watch"
desc   = """
The interior conditions, watched: the alarms that are a READING crossing a
line rather than a law failing to hold one.
"""
notes  = """
Empty run(), everything in observe(): the ALARMS page is read exactly when
the plant is parked. An unmeasured reading raises nothing here - the zone's
own quorum alarm covers it, and alarming twice for one dead probe would
blunt both.
"""
hooks  = ["observe"]

[in]
temp     = "cli_temp_hi"
margin   = "cli_dpMargin_degC"
strat    = "cli_dTStrat_degC"
too_hot  = "cli_tooHot_degC"
too_cold = "cli_tooCold_degC"
humid_at = "cli_dehumFull_degC"
strat_hi = "cli_dTStratHigh_degC"
sns      = ["alarm_sns_ceiling", "alarm_sns_floor",
             "alarm_sns_crawlspace", "alarm_sns_exterior"]

[out]
hot        = "alarm_too_hot"
cold       = "alarm_too_cold"
humid      = "alarm_too_humid"
stratified = "alarm_strat"
sensor     = "alarm_sensor_fault"
