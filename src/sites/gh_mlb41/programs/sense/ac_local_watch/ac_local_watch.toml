name   = "ac_local_watch"
class  = "AcLocalWatch"
task   = "SLOW"
health = "prog_ac_local_watch"
desc   = "The generator-backed side of the transfer switch, watched."
notes  = """
The same law as the grid over different rows and wider frequency bands: a
generator wanders where a utility does not.
"""
hooks  = ["observe", "on_bind"]

# The supply block, bound from this program's own interface: the two supplies
# declare the same member names and one law reads either.

[block.supply]
type    = "AcSupply"
include = "blocks/ac_supply/ac_supply.h"

[block.cranking]
type = "Ton"
doc  = "the grid gone with nothing taking over"

[in]
volts   = "ats_V"
amps    = "ats_A"
watts   = "ats_W"
hz      = "ats_Hz"
lo_V    = "pwr_localLo_V"
hi_V    = "pwr_localHi_V"
lo_Hz   = "pwr_localLo_Hz"
hi_Hz   = "pwr_localHi_Hz"
# The grid's verdict, decided earlier in the same beat: what makes a dead local
# supply a FAILED GENERATOR rather than a power cut nobody asked it to cover.
grid_ok = "sys_grid_ok"
start_s = "pwr_genStart_sec"

[out]
out_V     = "sys_local_V"
out_A     = "sys_local_A"
out_W     = "sys_local_W"
out_Hz    = "sys_local_Hz"
ok        = "sys_local_ok"
fault     = "alarm_ac_local"
gen_fault = "alarm_gen"

# The law as a network. The generator only owes an answer once the grid has gone
# AND this supply is silent, which is what the timer is started on.

[net.supply]
[net.supply.in]
volts = "volts"
amps  = "amps"
watts = "watts"
hz    = "hz"
lo_V  = "lo_V"
hi_V  = "hi_V"
lo_Hz = "lo_Hz"
hi_Hz = "hi_Hz"
[net.supply.out]
out_V  = "out_V"
out_A  = "out_A"
out_W  = "out_W"
out_Hz = "out_Hz"
ok     = "ok"
fault  = "fault"

[net.silent]
fn = "not_of"
[net.silent.in]
in = "supply.answered"

[net.waiting]
fn = "and_of"
[net.waiting.in]
in1 = "=!grid_ok"
in2 = "silent.out"

[net.cranking]
[net.cranking.in]
in       = "waiting.out"
delay_ms = "start_s"
dt       = "=c.dt_ms"
[net.cranking.out]
q = "gen_fault"
