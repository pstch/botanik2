name   = "target_temp"
class  = "TargetTempController"
task   = "SLOW"
health = "prog_target_temp"
desc   = """
The temperature the greenhouse is being held to: the base setting, shifted by
whichever bank phase is both IN FORCE and ARMED.
"""
notes  = """
Its own program because the target is a DECISION, not a property of the
phase: a bank moves it only when yesterday justified it, and a reader wants
the number rather than the rule.

The published number is FILTERED, so a phase boundary eases the target over
minutes instead of stepping it: everything downstream is a proportional or
staged response to the gap, and a step in the target is a step in all of them
at once. The clamp stays last, so the guard rails still bite immediately.
"""

[in]
t_min         = "cli_targetMin_degC"
t_max         = "cli_targetMax_degC"
phase         = "cli_phase"
cold_arm      = "cli_coldBankArm"
heat_arm      = "cli_heatBankArm"
cool_set      = "cli_coolSet_degC"
cold_bank_ofs = "cli_coldBankOfs_degC"
heat_bank_ofs = "cli_heatBankOfs_degC"
tau           = "cli_targetTau_s"

[block.smooth]
type = "Ewma"
doc  = "eases a phase boundary over cli_targetTau_s"

[out]
target = "cli_targetTemp_degC"

# The law as a network: the base target shifted by whichever bank phase is in
# force AND armed - a comparison, inline - then eased against the step a phase
# boundary is, and clamped LAST so a rail an operator just moved bites now.

[net.smooth]
[net.smooth.in]
x     = "=cool_set -/+ the armed bank offset"
tau_s = "tau"
dt    = "=c.dt_ms"

[net.clamp]
fn = "limit"
[net.clamp.in]
v  = "smooth.out"
lo = "t_min"
hi = "t_max"
[net.clamp.out]
out = "target"
