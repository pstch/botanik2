name   = "cooling"
class  = "CoolingController"
task   = "FAST"
health = "prog_cooling"
desc   = """
The cooling ladder: a PID on the interior temperature against the phase's
target, published as one signed demand.
"""
notes  = """
Negative is heating: the intractors drawing warm air from under the floor,
and below that the thermal screen. The actuators spread themselves along the
demand; this program does not know which they are.
"""

[fn.intake_gates]
type = "void (ProgramContext& c, float t_in, float dem)"
doc  = """
Whether drawing crawlspace air would help, in either direction. Published
rather than acted on: this law owns the reading, the intractors own the
device.
"""

[block.pid]
type = "Pid"

[block.cool_gate]
type = "Hysteresis"
doc  = "the intake is cooler by the margin"

[block.ground_gate]
type = "Hysteresis"
doc  = "...or warmer by it"

[block.ground_band]
type = "Hysteresis"
doc  = "and the ladder is asking for heat"

[in]
dem_hyst    = "cli_groundDemHyst"
inside      = "cli_temp_in"
# ...and the two levels behind it, for the VERDICT alone: an average carried by
# one level is still a temperature, and this law says it is working on half a
# picture rather than pretending otherwise.
ceiling     = "cli_temp_hi"
floor       = "cli_temp_lo"
target      = "cli_targetTemp_degC"
# What the intractors would actually deliver, and the two margins that decide
# whether drawing it is worth anything. The crawlspace IS the intake path.
intake      = "cli_temp_cs"
temp_margin = "cli_ventTempMgn_degC"
vent_hyst   = "cli_ventHyst_degC"
ground_dem  = "cli_groundHeatDem"
# The window staging, so the INTENDED opening is a row of its own: the windows
# then apply the interlocks to a published demand rather than re-deriving it.
win_start   = "cli_windowStartDem"
win_full    = "cli_windowFullDem"
kp          = "cli_coolKp"
ti          = "cli_coolTi_sec"
td          = "cli_coolTd_sec"

[out]
demand    = "cli_coolDem"
intake_ok = "cli_intakeCoolOk"
ground_ok = "cli_groundHeatOk"
window    = "cli_windowDem"

# The law as a network. One PID on the house's own temperature, its output
# laddered into a window opening, and two intake gates that decide whether
# drawing air would move the interior the way it is being asked to go.

[net.pid]
[net.pid.in]
sp     = "target"
pv     = "inside"
tuning = "=kp, ti, td"
dt     = "=c.dt_ms"
[net.pid.out]
out = "demand"

[net.window_ramp]
fn = "ladder"
[net.window_ramp.in]
v  = "demand"
lo = "win_start"
hi = "win_full"
[net.window_ramp.out]
out = "window"

[net.warmer_in]
fn = "sub"
[net.warmer_in.in]
in1 = "inside"
in2 = "intake"

[net.cooler_in]
fn = "sub"
[net.cooler_in.in]
in1 = "intake"
in2 = "inside"

[net.band_lo]
fn = "sub"
[net.band_lo.in]
in1 = "temp_margin"
in2 = "vent_hyst"

[net.cool_gate]
[net.cool_gate.in]
value = "warmer_in.out"
low   = "band_lo.out"
high  = "temp_margin"

[net.intake_worth_it]
fn = "and_of"
[net.intake_worth_it.in]
in1 = "=intake valid"
in2 = "cool_gate.q"
[net.intake_worth_it.out]
out = "intake_ok"

# The mirror, and the only place the negative half of the ladder does anything.
[net.rung_top]
fn = "add"
[net.rung_top.in]
in1 = "=-ground_dem"
in2 = "dem_hyst"

[net.ground_band]
[net.ground_band.in]
value = "=-demand"
low   = "=-ground_dem"
high  = "rung_top.out"

[net.ground_gate]
[net.ground_gate.in]
value = "cooler_in.out"
low   = "band_lo.out"
high  = "temp_margin"

[net.asking]
fn = "and_of"
[net.asking.in]
in1 = "=intake valid"
in2 = "ground_band.q"

[net.ground_worth_it]
fn = "and_of"
[net.ground_worth_it.in]
in1 = "asking.out"
in2 = "ground_gate.q"
[net.ground_worth_it.out]
out = "ground_ok"
