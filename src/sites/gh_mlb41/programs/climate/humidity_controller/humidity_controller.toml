name   = "humidity"
class  = "HumidityController"
task   = "SLOW"
health = "prog_humidity"
desc   = """
The humidity ladder: four bands and a dead zone on the dew-point margin,
published as one signed demand - and the rot guard under it.
"""
notes  = """
Negative dehumidifies, positive humidifies. Set in degC rather than kPa
because CONDENSATION is what is guarded against, and that happens at the
temperature the surfaces are at. The guard is the same signal against a
different question - `cli_rotMargin_degC` is what `alarm_rot` means - and it
is one program because two laws reading one margin can disagree on the beat
it moves.
"""
hooks  = ["observe"]

[fn.dry_gate]
type = "void (ProgramContext& c)"
doc  = """
Whether the air outside would dry the greenhouse if drawn in. Dew points, so
it survives a cold damp morning reading 95% RH.
"""

[block.lockout_for]
type = "Tof"
doc  = "the lockout's overrun past the condition"

[block.dry_gate_band]
type = "Hysteresis"
doc  = "two dew points that converge, so a dead band"

[in]
rot_release_s = "cli_rotRelease_sec"
dp_margin     = "cli_dpMargin_degC"
dehum_full    = "cli_dehumFull_degC"
dehum_start   = "cli_dehumStart_degC"
humid_start   = "cli_humidStart_degC"
humid_full    = "cli_humidFull_degC"
rot_limit     = "cli_rotMargin_degC"
rot           = "alarm_rot"
# The dryness gate: whether the air outside would dry the greenhouse at all.
# Dew points, not humidities - a colder outside at the same RH is drier air.
in_t          = "cli_temp_hi"
in_rh         = "cli_rh_hi"
ext_t         = "cli_temp_ext"
ext_rh        = "cli_rh_ext"
dry_margin    = "cli_ventDryMgn_degC"
vent_hyst     = "cli_ventHyst_degC"

[out]
demand   = "cli_humidDem"
lockout  = "cli_rotLockout"
vent_dem = "cli_rotVentDem"
dry_ok   = "cli_intakeDryOk"

# The irrigation subsystem is three programs, along the seam the spec draws: a
# ladder (how thirsty the air has been), an instrument (what the two meters
# say), and the law that acts (which tray, and the valves).

# The law as a network: one signed demand off the dew-point margin, the rot ramp
# under it, and the dryness gate beside them - which bands the difference of two
# DEW POINTS, because a colder outside at the same RH is drier air.

[net.demand]
fn = "signed_ladder"
[net.demand.in]
v         = "dp_margin"
neg_full  = "dehum_full"
neg_start = "dehum_start"
pos_start = "humid_start"
pos_full  = "humid_full"
[net.demand.out]
out = "demand"

# A FALLING ramp, negated so the one ladder serves both directions: nothing at
# the limit, everything at the dew point itself.
[net.rot_ramp]
fn = "ladder"
[net.rot_ramp.in]
v  = "=-dp_margin"
lo = "=-rot_limit"
hi = "=0"
[net.rot_ramp.out]
out = "vent_dem"

# An OVERRUN, not a dwell: humidifying into air that has only just dried out is
# what puts the margin back where it was.
[net.lockout_for]
[net.lockout_for.in]
in       = "rot"
delay_ms = "rot_release_s"
dt       = "=c.dt_ms"
[net.lockout_for.out]
q = "lockout"

[net.dry_gate_band]
[net.dry_gate_band.in]
value = "=dew_point(in_t, in_rh) - dew_point(ext_t, ext_rh)"
low   = "=dry_margin - vent_hyst"
high  = "dry_margin"
[net.dry_gate_band.out]
q = "dry_ok"
