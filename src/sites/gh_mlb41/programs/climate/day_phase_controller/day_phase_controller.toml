# day_phase: what this POU is connected to, what it holds, and what it
# declares. The body is in day_phase_controller.cpp; everything else here is
# generated into day_phase_controller.gen.h.

name   = "day_phase"
class  = "DayPhaseController"
task   = "SLOW"
health = "prog_day_phase"
desc   = "The day's phase, and the temperature target it puts in force."
notes  = """
The phase never commands an actuator: it sets the target and the permissions,
and the ladders below decide what moves. See the spec's phase table.

The six phases are five boundaries, each declared as an offset in minutes from
sunrise or from sunset, so the whole table slides with the season instead of
being a clock an operator re-enters four times a year.
"""

# What the law remembers between activations.

[var]
_phase     = { type = "DayPhase", init = "PHASE_NIGHT" }
_day_max   = { type = "float", init = "0.0f", doc = "The interior extremes since the current day and night began. What COLD_BANK and HEAT_BANK are gated on: pre-cool only after a hot day, bank heat only after a cold night." }
_night_min = { type = "float", init = "0.0f" }
_seeded    = { type = "bool", init = "false" }

# Its own helpers.

[fn]
_phase_at = { type = "DayPhase (int16_t from_rise, int16_t from_set) const", doc = "The phase two offsets land in, with the two BANK phases skipped when yesterday did not arm them." }



[in]
# The house's own row, the same one the cooling ladder controls on: what the
# bank phases arm against is the interior, not one level of it.
inside         = "cli_temp_in"
# WHERE THE DAY IS, as two published offsets. The tracker is sun_watch's; this
# law is a phase table over two numbers and reads nothing else about the sky.
from_rise      = "sol_fromRise_min"
from_set       = "sol_fromSet_min"
cold_bank_trg  = "cli_coldBankTrg_degC"
heat_bank_trg  = "cli_heatBankTrg_degC"
# The five boundaries, each an offset in minutes from sunrise or from sunset.
cold_bank_rise = "sol_coldBankRise_min"
breeze_rise    = "sol_breezeRise_min"
day_rise       = "sol_dayRise_min"
heat_bank_set  = "sol_heatBankSet_min"
dusk_set       = "sol_duskSet_min"
night_set      = "sol_nightSet_min"

[out]
phase    = "cli_phase"
cold_arm = "cli_coldBankArm"
heat_arm = "cli_heatBankArm"

# The two extremes this law gathers AND then arms the banks against: published,
# and read back rather than kept to itself, so an operator can force one and
# rehearse a cold-bank morning in July.

[inout]
prev_day_max   = "cli_prevDayMax_degC"
prev_night_min = "cli_prevNightMin_degC"
