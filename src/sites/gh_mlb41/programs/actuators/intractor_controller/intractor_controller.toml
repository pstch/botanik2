name   = "intractors"
class  = "IntractorController"
task   = "SLOW"
health = "prog_intractors"
hooks  = ["on_bind"]
desc   = """
The two intractors: variable-speed fans drawing air from under the floor,
driven by whichever of three demands wants the most.
"""
notes  = """
Both run at one speed - they serve one volume - and the fusion is a MAXIMUM,
so each input is a floor rather than a share. The ramp spans the two staging
thresholds, so the windows and the intractors hand over rather than overlap.
"""

[var.safe_speed]
type = "float"
init = "0.0f"
doc  = """
Where these go when this law is not acting, off the row's own declared safe
value. NOT stopped: some air is always wanted.
"""

[in]
cool_dem     = "cli_coolDem"
rot_vent     = "cli_rotVentDem"
humid_dem    = "cli_humidDem"
ground_speed = "cli_groundSpeed"
start_dem    = "cli_intakeStartDem"
full_dem     = "cli_intakeFullDem"
# The three gates, each decided by the law that owns the reading behind it: a
# demand whose gate is shut contributes nothing to the maximum.
cool_ok      = "cli_intakeCoolOk"
ground_ok    = "cli_groundHeatOk"
dry_ok       = "cli_intakeDryOk"

[out]
intr = { rows = "cli_intr*", count = 2 }

# The law as a network: four demands fused by MAX and laddered to a speed, then
# floored twice - by this actuator's own safe speed, and by the ground-heat rung
# when the crawlspace is worth drawing on. Each demand's gate is one test and
# stays inline.

[net.demand]
fn = "max_of"
[net.demand.in]
in1 = "=cool_dem while the intake is cooler, or rot_vent"
in2 = "=the humidity arm, whichever way it points"

[net.ramp]
fn = "ladder"
[net.ramp.in]
v  = "demand.out"
lo = "start_dem"
hi = "full_dem"

[net.floored]
fn = "max_of"
[net.floored.in]
in1 = "=safe_speed, the row's own"
in2 = "ramp.out"

# ONE RUNG, not a ramp: pulling harder on a cold house moves more air through
# the same ground, cooling the ground rather than warming the house.
[net.speed]
fn = "max_of"
[net.speed.in]
in1 = "floored.out"
in2 = "=ground_speed, while the ground is worth it"
[net.speed.out]
out = "intr"
