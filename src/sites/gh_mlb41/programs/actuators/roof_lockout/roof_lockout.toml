name   = "roof_lockout"
class  = "RoofLockout"
task   = "SLOW"
health = "prog_roof_lockout"
desc   = "What forbids the roof being open at all, whatever the ladder asks."
notes  = """
Stage 1 of the roof's arbitration, and absolute: rain, wind and a supply
lockout shut the windows whatever else is true, including their own safe state.
Its own program because the interlocks are a judgement about the WEATHER, while
the windows are a judgement about four rams sharing one bus.

Published and then obeyed: the windows read `cli_windowLockout` back rather
than a verdict of their own, so an operator can force one and hold the roof
shut without inventing weather. It is also the only way to rehearse stage 1.
"""

[block.rain_for]
type = "Tof"
doc  = "the rain lockout's overrun past the last drop"

[in]
rain_mmph   = "cli_rain_mmph"
wind_mps    = "cli_wind_mps"
gust_mps    = "cli_windGust_mps"
shut_end   = "cli_windShutEnd_mps"
shut_begin   = "cli_windShutBegin_mps"
shut_max    = "cli_windShutMax"
rain_hold_s = "cli_rainLockout_sec"
supply_lock = "sys_supply_lockout"

[inout]
rain_lock   = "cli_rainLockout"
wind_lock   = "cli_windLockout"
window_lock = "cli_windowLockout"

[out]
cap = "cli_windowCap"

# The law as a network. The GUST or the mean, whichever is higher, decides both
# the lockout and the ceiling. An unmeasured sky is a live interlock of its own,
# so each lockout is that peak against its own threshold, ORed with blind.

[net.peak]
fn = "max_of"
[net.peak.in]
in1 = "gust_mps"
in2 = "wind_mps"

# An OVERRUN, not a dwell: a shower that has just stopped is about to be one
# that has not. Being BLIND is not a shower - it is live while it lasts.
[net.rain_for]
[net.rain_for.in]
in       = "=rain_mmph > 0"
delay_ms = "rain_hold_s"
dt       = "=c.dt_ms"
[net.rain_for.out]
q = "rain_lock"

# From shut_begin the ceiling comes down a straight line to nothing at
# shut_end, so the roof is nearly shut before the lockout takes it the rest.
[net.ceiling]
fn = "scale"
[net.ceiling.in]
v      = "peak.out"
in_lo  = "shut_begin"
in_hi  = "shut_end"
out_lo = "shut_max"
out_hi = "=0"

# READ BACK off the rows, never the verdicts: each is what an operator can
# force, and a lockout the law then ignored would be a lie on the page.
[net.capped]
fn = "sel"
[net.capped.in]
g   = "window_lock"
in0 = "ceiling.out"
in1 = "=0"
[net.capped.out]
out = "cap"
