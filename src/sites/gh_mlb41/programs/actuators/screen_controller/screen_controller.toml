name   = "screen"
class  = "ScreenController"
task   = "SLOW"
health = "prog_screen"
desc   = """
The thermal screen: one coil, deployed when the greenhouse is losing heat
rather than gaining it.
"""
notes  = """
Two independent causes, either sufficient: the cooling ladder far enough
negative, or a cold night. No feedback, so travel is TIMED, and the
destratification fans are cut while the fabric moves through the air they
blow into.
"""
hooks  = ["observe"]

[var.deployed]
type = "bool"
init = "false"

[var.seeded]
type = "bool"
init = "false"

[var.command_changed]
type = "bool"
init = "false"

[fn.command]
type = "void (bool deploy)"
doc  = "Command the screen, starting a traverse if that is a change."

[block.travelling]
type = "Tp"
doc  = "a pulse of the fabric's travel time"

[in]
cool_dem     = "cli_coolDem"
deploy_dem   = "cli_thermalScreenDem"
phase        = "cli_phase"
travel_s     = "cli_screenTravel_sec"
travel_tmo_s = "cli_screenTmo_sec"

[out]
screen = "cli_screen"
moving = "cli_screenMoving"
