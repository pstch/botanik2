name   = "screen"
class  = "ScreenController"
task   = "SLOW"
health = "prog_screen"
desc   = """
The thermal screen: one coil, deployed when the greenhouse is losing heat
rather than gaining it.
"""
notes  = """
Two independent causes, either sufficient: the cooling ladder far enough
negative, or a cold night. No feedback, so travel is TIMED: the fabric block carries the estimate and
says UNKNOWN until a stroke to an end has datumed it. The destratification
fans are cut while it moves through the air they blow into.
"""
hooks  = ["observe"]

[block.fabric]
type = "Actuator"
doc  = "where the fabric is, and whether it is travelling"

[fn.mechanics]
type = "Plc::ActuatorConfig () const"
doc  = """
The traverse, rebuilt each scan from the parameters: a re-timed screen has to
land on the next stroke, not the next boot.
"""

[in]
cool_dem     = "cli_coolDem"
deploy_dem   = "cli_thermalScreenDem"
phase        = "cli_phase"
travel_s     = "cli_screenTravel_sec"
travel_tmo_s = "cli_screenTmo_sec"

[out]
screen = "cli_screen"
moving = "cli_screenMoving"

# The law as a network. The phase gives PERMISSION and the demand asks for the
# move; denied, the command stands, read back off the row an operator can force.

[net.cold]
fn = "le"
[net.cold.in]
in1 = "cool_dem"
in2 = "deploy_dem"

[net.allowed]
fn = "and_of"
[net.allowed.in]
in1 = "phase"
in2 = "cold.out"

[net.command]
fn = "sel"
[net.command.in]
g   = "allowed.out"
in0 = "screen"
in1 = "cold.out"
[net.command.out]
out = "screen"

[net.fabric]
[net.fabric.in]
target = "screen"
cfg    = "=travel_s capped at travel_tmo_s"
dt     = "=c.dt_ms"
[net.fabric.out]
moving = "moving"
