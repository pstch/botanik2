name   = "skirt"
class  = "SkirtController"
task   = "SLOW"
health = "prog_skirt"
desc   = "The wet skirt: one valve pulsed against two demands."
notes  = """
PROPORTIONAL on the humidify arm - it IS the humidifier - and STAGED on the
cooling axis, only while the air is dry enough for a wet pad to cool
anything. The rot lockout cuts it outright: wetting condensing air is the
one thing this valve must never do.
"""
hooks  = ["on_bind"]

# `pulse` rather than `valve`: the ROW is the coil, and the block is the pulse
# train that decides when it is energised.

[block.pulse]
type    = "ValveController"
include = "blocks/valve_controller.h"
doc     = "the on-time within a period"

[in]
cool_dem   = "cli_coolDem"
humid_dem  = "cli_humidDem"
cool_start = "cli_skirtCoolDem"
dry_min    = "cli_skirtDryMin_degC"
dp_margin  = "cli_dpMargin_degC"
rot_lock   = "cli_rotLockout"
period_s   = "cli_skirtPeriod_sec"
min_on_s   = "cli_skirtMinOn_sec"

[out]
valve = "cli_skirtValve"
duty  = "cli_skirtDuty"

# The law as a network. PROPORTIONAL on the humidify arm and STAGED on the
# cooling one, whichever asks for more - and the rot lockout above both, because
# wetting air that is already condensing is what this valve must never do.

[net.cool]
fn = "ladder"
[net.cool.in]
v  = "cool_dem"
lo = "cool_start"
hi = "=1"

# In damp air a wet pad only adds water, so the cooling arm is gated on the
# margin rather than laddered straight through.
[net.staged]
fn = "sel"
[net.staged.in]
g   = "=dp_margin >= dry_min"
in0 = "=0"
in1 = "cool.out"

[net.effort]
fn = "max_of"
[net.effort.in]
in1 = "=limit(humid_dem, 0, 1)"
in2 = "staged.out"

[net.asked]
fn = "sel"
[net.asked.in]
g   = "=rot_lock || inhibited"
in0 = "effort.out"
in1 = "=0"

[net.pulse]
[net.pulse.in]
duty       = "asked.out"
period_ms  = "period_s"
min_on_ms  = "min_on_s"
dt         = "=c.dt_ms"
[net.pulse.out]
coil    = "valve"
on_time = "duty"
