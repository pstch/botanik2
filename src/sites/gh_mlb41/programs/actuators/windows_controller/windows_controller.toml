name   = "windows"
class  = "WindowsController"
task   = "SLOW"
health = "prog_windows"
desc   = """
The four roof windows: one target from the cooling ladder, and ONE MOVING AT A
TIME.
"""
notes  = """
One at a time is ELECTRICAL, so a safety cannot break it either: a rain
interlock shuts them in sequence. A window keeps the bus until its stroke
ends, so a target moving mid-travel cannot leave a coil energised. The
humidity demand is deliberately not read: cooling wins over anti-dryness,
and with no cooling demand they are shut anyway.
"""
hooks  = ["observe", "on_bind"]

[var.target]
type = "float"
init = "0.0f"
doc  = """
The position the arbitration asked for this scan. One number for all four:
they are one roof.
"""

[var.safe_open]
type = "float"
init = "0.0f"
doc  = """
Where the roof goes when this law is not acting: PART OPEN, not shut, read off
the target row's declared default like every other safe state here. It should
never be reached, but a greenhouse with some ventilation survives a summer
afternoon and a sealed one does not. @note NOT the interlocks: rain and wind
shut the roof outright.
"""

[fn.mechanics]
type = "Plc::ActuatorConfig () const"
doc  = """
The mechanics, rebuilt each scan from the parameters: a recalibrated travel
time has to land on the next stroke, not the next boot.
"""

[fn.shut_in]
type = "bool (ProgramContext& c)"
doc  = """
Whether anything forbids the windows being open at all. Publishes the two
reasons it owns.
"""

[fn.owner]
type = "int8_t (float target, const Plc::ActuatorConfig& cfg) const"
doc  = "Which window may move this scan, or -1."

[block.act]
type  = "Actuator"
count = 4

[block.rain_for]
type = "Tof"
doc  = "the rain lockout's overrun past the last drop"

[in]
# The INTENDED opening, laddered by the cooling law that owns the demand. This
# program's job is the interlocks and the rams, not the staging.
window_dem  = "cli_windowDem"
rain_mmph   = "cli_rain_mmph"
wind_mps    = "cli_wind_mps"
gust_mps    = "cli_windGust_mps"
wind_shut   = "cli_windShut_mps"
rain_hold_s = "cli_rainLockout_sec"
travel_s    = "cli_windowTravel_sec"
tmo_s       = "cli_windowTmo_sec"
supply_lock = "sys_supply_lockout"

# The two lockouts this law derives AND then obeys: it publishes what the
# instruments say, and shuts the roof on what the ROW reads back. An operator
# forcing one is the point - a lockout nobody can override is a lockout nobody
# can test, and one the law ignored would be a lie on the page.

[inout]
rain_lock   = "cli_rainLockout"
wind_lock   = "cli_windLockout"
# ...and their verdict, published and then obeyed the same way: one row an
# operator can force to hold the roof shut without inventing weather.
window_lock = "cli_windowLockout"

[out]
opn = { rows = "cli_window*_opn", count = 4 }
clo = { rows = "cli_window*_clo", count = 4 }
tgt = { rows = "cli_window*_tgt", count = 4 }
pos = { rows = "cli_window*_pos", count = 4 }
