name   = "fans"
class  = "FanController"
task   = "SLOW"
health = "prog_fans"
desc   = """
The two destratification fans: three relayed speeds, driven by whichever of
three demands wants the most.
"""
notes  = """
The three speed relays are exclusive, and the band the fused demand falls in
picks one. That band is hysteretic: the inputs are FLOORS, so the winner
moves as the plant does. A travelling screen cuts them outright.
"""

[fn.demand]
type = "float () const"
doc  = "The three demands, fused."

[fn.band]
type = "uint8_t (float demand)"
doc  = "The speed @p demand asks for, given the one in force."

[fn.drive]
type = "void (uint8_t speed)"
doc  = "Energise exactly one speed relay, or none."

[block.steps]
type = "Staircase3"


[in]
dem_hyst      = "cli_fanDemHyst"
irr_dem       = "cli_fanIrrDem"
strat_dem     = "cli_stratDem"
cool_dem      = "cli_coolDem"
irr_state     = "irr_state"
screen_moving = "cli_screenMoving"
low_dem       = "cli_fanLowDem"
med_dem       = "cli_fanMedDem"
high_dem      = "cli_fanHighDem"
# The two BREEZES are the fans' business: a light circulation at dusk dries the
# leaves before the stomata open, and at dawn it takes the night's condensation
# off them. The phase asks; this is how much.
phase         = "cli_phase"
breeze_dem    = "cli_breezeDem"

[out]
speed1 = { rows = "cli_destrat*_speed1", count = 2 }
speed2 = { rows = "cli_destrat*_speed2", count = 2 }
speed3 = { rows = "cli_destrat*_speed3", count = 2 }
# The band itself, published: three coils are three facts, and what an operator
# wants is the one number they add up to.
band   = "cli_fanSpeed"

# The law as a network. Four demands fused by MAX, a staircase turning that into
# a speed, and two interlocks that get to overrule it - the screen mechanically,
# the inhibit down to speed 1, because still air is itself a rot risk.

[net.strat_dem_or_floor]
fn = "sel"
[net.strat_dem_or_floor.in]
g   = "=strat_dem valid"
in0 = "low_dem"
in1 = "strat_dem"

[net.cool_dem_or_floor]
fn = "sel"
[net.cool_dem_or_floor.in]
g   = "=cool_dem valid"
in0 = "low_dem"
in1 = "cool_dem"

[net.idle]
fn = "eq"
[net.idle.in]
in1 = "irr_state"
in2 = "=IRR_IDLE"

[net.watering]
fn = "sel"
[net.watering.in]
g   = "idle.out"
in0 = "irr_dem"
in1 = "=0"

[net.breezing]
fn = "or_of"
[net.breezing.in]
in1 = "=phase is DAWN_BREEZE"
in2 = "=phase is DUSK_BREEZE"

[net.breeze]
fn = "sel"
[net.breeze.in]
g   = "breezing.out"
in0 = "=0"
in1 = "breeze_dem"

[net.climate]
fn = "max_of"
[net.climate.in]
in1 = "strat_dem_or_floor.out"
in2 = "cool_dem_or_floor.out"

[net.errands]
fn = "max_of"
[net.errands.in]
in1 = "watering.out"
in2 = "breeze.out"

[net.demand]
fn = "max_of"
[net.demand.in]
in1 = "climate.out"
in2 = "errands.out"

[net.steps]
[net.steps.in]
value = "demand.out"
edge1 = "low_dem"
edge2 = "med_dem"
edge3 = "high_dem"
hyst  = "dem_hyst"

[net.after_inhibit]
fn = "sel"
[net.after_inhibit.in]
g   = "=inhibit_requested()"
in0 = "steps.level"
in1 = "=1"

[net.speed]
fn = "sel"
[net.speed.in]
g   = "screen_moving"
in0 = "after_inhibit.out"
in1 = "=0"
[net.speed.out]
out = "band"

[net.at1]
fn = "eq"
[net.at1.in]
in1 = "band"
in2 = "=1"
[net.at1.out]
out = "speed1"

[net.at2]
fn = "eq"
[net.at2.in]
in1 = "band"
in2 = "=2"
[net.at2.out]
out = "speed2"

[net.at3]
fn = "eq"
[net.at3.in]
in1 = "band"
in2 = "=3"
[net.at3.out]
out = "speed3"
