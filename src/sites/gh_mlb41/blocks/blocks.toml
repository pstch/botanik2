# blocks.toml - the site's OWN function blocks.
#
# The library declares its blocks with the library. These three are the ones
# this greenhouse needed and nowhere else does, so what they present and what
# they do inside is declared here, beside the headers - not in the report that
# draws them.
#
# `in` and `out` are the pin names, which is what the network tables are checked
# against. `inside` is the reference page: a `kind` the report knows how to draw
# and the nodes for it, each tagged in, param, block or out.

[ValveController]
brief = "one two-position valve"
in    = ["duty", "period_ms", "min_on_ms", "dt"]
out   = ["coil", "on_time"]
notes = [
  "A pulse train: a fractional demand becomes an ON-TIME within a period. A pulse under min_on_ms is not made at all, because one that short does not lift the seat - rounding it up would deliver water nobody asked for.",
  "park() drives it where a DEAD CONTROLLER would leave it, and the fail direction is read off the coil ROW's declared default: the table is the one place it is said.",
  "Used for: the irrigation cycle's ten valves, and the wet skirt.",
]
[ValveController.inside]
kind = "flow"
cols = [
  [["duty", "0..1 demand", "in"], ["period_ms", "", "in"], ["min_on_ms", "", "in"]],
  [["on_ms", "duty * period, 0 under min_on", "block"], ["phase", "phase += dt, wraps", "block"]],
  [["coil", "phase < on_ms", "out"]],
]
wires = [
  ["duty", "on_ms", ""], ["period_ms", "phase", ""], ["min_on_ms", "on_ms", ""],
  ["on_ms", "coil", ""], ["phase", "coil", ""],
]

[AcSupply]
brief = "one AC supply, mirrored and judged"
in    = ["volts", "amps", "watts", "hz", "lo_V", "hi_V", "lo_Hz", "hi_Hz"]
out   = ["out_V", "out_A", "out_W", "out_Hz", "ok", "fault", "answered"]
notes = [
  "The mirror exists because a field-read row carries no Modbus register of its own, so an external master could not see the meter without one.",
  "A meter that has NEVER answered is bring-up, not a fault. Only one that answered and then stopped raises it.",
  "Bound from either supply's interface by template: the grid and the generator declare the same member names, and the compiler is what holds them to it.",
]
[AcSupply.inside]
kind = "flow"
cols = [
  [["volts", "field read", "in"], ["amps", "field read", "in"],
   ["watts", "field read", "in"], ["hz", "field read", "in"],
   ["lo_V / hi_V", "the voltage band", "param"],
   ["lo_Hz / hi_Hz", "the frequency band", "param"]],
  [["deadband x4", "one per quantity", "block"],
   ["in_range", "V and Hz against their bands", "block"]],
  [["out_V / out_A / out_W / out_Hz", "the mirror", "out"],
   ["ok", "measured and in spec", "out"],
   ["fault", "out of spec, or gone silent", "out"],
   ["answered", "so the caller can say DEGRADED", "out"]],
]
wires = [
  ["volts", "deadband x4", ""], ["amps", "deadband x4", ""],
  ["watts", "deadband x4", ""], ["hz", "deadband x4", ""],
  ["deadband x4", "out_V / out_A / out_W / out_Hz", ""],
  ["volts", "in_range", ""], ["hz", "in_range", ""],
  ["lo_V / hi_V", "in_range", ""], ["lo_Hz / hi_Hz", "in_range", ""],
  ["in_range", "ok", ""], ["in_range", "fault", ""], ["volts", "answered", ""],
]

[ZoneProbes]
brief = "three probes become one reading"
in    = ["t", "h", "tau_s"]
out   = ["temperature", "humidity", "valid"]
notes = [
  "Dropping the outlier and averaging the two that agree keeps the second good probe's information, where a plain median throws it away.",
  "Only VALID probes take part. With none left the zone's rows go INVALID rather than publishing a number nothing measured.",
]
[ZoneProbes.inside]
kind = "flow"
cols = [
  [["t[3]", "three probes", "in"], ["h[3]", "", "in"]],
  [["select", "drop the OUTLIER, average the two that agree", "block"]],
  [["Ewma x2", "against dt, tau from a parameter", "block"]],
  [["temp, rh", "the zone's rows", "out"], ["quorum", "alarm on too few", "out"]],
]
wires = [
  ["t[3]", "select", ""], ["h[3]", "select", ""], ["select", "Ewma x2", ""],
  ["Ewma x2", "temp, rh", ""], ["select", "quorum", "used"],
]
