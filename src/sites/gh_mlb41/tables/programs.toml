# programs.toml - the IEC 61131-3 CONFIGURATION for gh_mlb41.
#
# Which control programs exist, what rate class each is dispatched at, and which
# table row every one of its variables is connected to. A Plc::Program is a
# PROGRAM POU and takes no arguments, so this file is what joins its declared
# interface to the global table.
#
# Sections, and what each promises:
#
#   in     VAR_INPUT           read-only; drive() on it does not compile
#   out    VAR_OUTPUT          this program is the row's ONE producer
#   inout  VAR_IN_OUT          read-modify-write, SHARED by declaration
#
# A member is `name = "row"`, or `name = ["row", ...]` for an array. The TYPE
# comes from the table, so a member cannot disagree with the row it names.
#
# scripts/vars_gen.py turns this into generated/programs.gen.h: one Refs struct
# per program, and the bind() body that resolves it. A program holds that struct
# as `_v`. Edit here, re-run the generator, commit both.
#
# ORDER IS EXECUTION ORDER within the control phase, and these are in signal
# order: conditioning, the day's shape, then the laws that read them.

[[program]]
name  = "ac_grid_watch"
class = "AcGridWatch"
task  = "SLOW"
stage = "sense"
health = "prog_ac_grid_watch"
desc  = "The utility feed, watched."
notes = """
A watch program: empty run(), everything in observe(). What it publishes is an
observation, and observations are exactly what must survive the plant being
parked.
"""

# The supply block, bound from this program's own interface: the two supplies
# declare the same member names and one law reads either.
[program.block]
supply = { type = "AcSupply", include = "blocks/ac_supply.h" }

[program.in]
volts = "grid_LN_V"
amps  = "grid_total_A"
watts = "grid_total_W"
hz    = "grid_Hz"
lo_V  = "pwr_gridLo_V"
hi_V  = "pwr_gridHi_V"
lo_Hz = "pwr_gridLo_Hz"
hi_Hz = "pwr_gridHi_Hz"
[program.out]
out_V  = "sys_grid_V"
out_A  = "sys_grid_A"
out_W  = "sys_grid_W"
out_Hz = "sys_grid_Hz"
ok     = "sys_grid_ok"
fault  = "alarm_ac_grid"

# The generator-backed side, downstream of the transfer switch. Same members as
# the grid above, because AcSupply is bound from either by template.
[[program]]
name  = "ac_local_watch"
class = "AcLocalWatch"
task  = "SLOW"
stage = "sense"
health = "prog_ac_local_watch"
desc  = "The generator-backed side of the transfer switch, watched."
notes = """
The same law as the grid over different rows and wider frequency bands: a
generator wanders where a utility does not.
"""

# The supply block, bound from this program's own interface: the two supplies
# declare the same member names and one law reads either.
[program.block]
supply = { type = "AcSupply", include = "blocks/ac_supply.h" }
cranking = { type = "Ton", doc = "the grid gone with nothing taking over" }

[program.in]
volts = "ats_V"
amps  = "ats_A"
watts = "ats_W"
hz    = "ats_Hz"
lo_V  = "pwr_localLo_V"
hi_V  = "pwr_localHi_V"
lo_Hz = "pwr_localLo_Hz"
hi_Hz = "pwr_localHi_Hz"
# The grid's verdict, decided earlier in the same beat: what makes a dead local
# supply a FAILED GENERATOR rather than a power cut nobody asked it to cover.
grid_ok = "sys_grid_ok"
start_s = "pwr_genStart_sec"
[program.out]
out_V  = "sys_local_V"
out_A  = "sys_local_A"
out_W  = "sys_local_W"
out_Hz = "sys_local_Hz"
ok     = "sys_local_ok"
fault  = "alarm_ac_local"
gen_fault = "alarm_gen"

[[program]]
name  = "dc_watch"
class = "DcWatch"
task  = "SLOW"
stage = "sense"
health = "prog_dc_watch"
desc  = "The DC rails and the two batteries, watched - and the plant-wide lockout they raise."
notes = """
`sys_supply_lockout` follows the UPS LOW-BATTERY CONTACT, not a voltage: the
UPS knows what its own battery has left, and a divider on the rail does not.
The voltages alarm on their own floors, which is warning rather than
interlock.
"""

# One deadband and one rolling average per divider, and the debounce under the
# UPS contact. Named for what they do: the ROWS are called dc1, dc2, ups_bat.
[program.block]
band1   = { type = "Deadband" }
band2   = { type = "Deadband" }
bandu   = { type = "Deadband" }
bandg   = { type = "Deadband" }
avg1    = { type = "Ewma", doc = "the rail is judged on the AVERAGE, so one" }
avg2    = { type = "Ewma", doc = "noisy sample cannot raise a supply fault" }
avgu    = { type = "Ewma" }
avgg    = { type = "Ewma" }
low_for = { type = "Ton", doc = "debounce: a contact bounces, a UPS does not" }

[program.in]
dc1     = "pwr_dc1_V"
dc2     = "pwr_dc2_V"
ups_bat = "pwr_upsBat_V"
gen_bat = "pwr_genBat_V"
# One rolling average per divider: the rail is judged on the AVERAGE, so a
# single noisy sample cannot raise a supply fault.
dc1_avg = "pwr_dc1_avg_ms"
dc2_avg = "pwr_dc2_avg_ms"
ups_avg = "pwr_upsBat_avg_ms"
gen_avg = "pwr_genBat_avg_ms"
dc1_lo  = "pwr_dc1Lo_V"
dc2_lo  = "pwr_dc2Lo_V"
ups_lo  = "pwr_upsBatLo_V"
gen_lo  = "pwr_genBatLo_V"
low_bat = "pwr_upsLowBat"
[program.out]
out_dc1 = "sys_dc1_V"
out_dc2 = "sys_dc2_V"
out_ups = "sys_upsBat_V"
out_gen = "sys_genBat_V"
ok      = "sys_dc_ok"
lockout = "sys_supply_lockout"
ps1_flt = "alarm_dc_ps1"
ps2_flt = "alarm_dc_ps2"
ups_flt = "alarm_dc_ups"
gen_flt = "alarm_generator_battery"

[[program]]
name  = "sun_watch"
class = "SunWatch"
task  = "SLOW"
stage = "sense"
health = "prog_sun_watch"
desc  = "Where the sun is, published as rows."
notes = """
The tracker is INSIDE this program: it is an instrument, and what turns an
instrument into rows is a watch, exactly as the field-bus client does for the
probes. Everything downstream reads the rows - a law that wants to know where
the day is asks the table, not the tracker - so no other program needs a
reference to anything but its own interface.

Configured from the `geo_` pair through Vars::bind_sun(), which the firmware
hands tracker() at bring-up.
"""

# The instrument is INSIDE this program (Sun::SunPositionTracker, configured
# from the geo_ pair), and what leaves it are rows. Everything downstream reads
# the rows: a law that wants to know where the day is asks the table, not the
# tracker.
[program.out]
from_rise = "sol_fromRise_min"
from_set  = "sol_fromSet_min"
elevation = "sol_elev_deg"

[[program]]
name  = "temp_rh_zone"
class = "TempRHZone"
task  = "FAST"
stage = "sense"
health = "prog_temp_rh_zone"
desc  = "The conditioned picture of the greenhouse: four locations voted and filtered, then the psychrometrics every other law is set in."
notes = """
Runs FIRST. Everything downstream reads its rows rather than the probes.
"""


# One per measurement location: three probes selected down to one reading,
# then filtered. Held by value so one zone's filter state cannot become
# another's.
[program.block]
ceiling    = { type = "ZoneProbes", include = "blocks/zone_probes.h" }
floor      = { type = "ZoneProbes", include = "blocks/zone_probes.h" }
crawlspace = { type = "ZoneProbes", include = "blocks/zone_probes.h" }
exterior   = { type = "ZoneProbes", include = "blocks/zone_probes.h" }

[program.in]
t_hi  = ["cli_temp_hi1",  "cli_temp_hi2",  "cli_temp_hi3"]
h_hi  = ["cli_rh_hi1",    "cli_rh_hi2",    "cli_rh_hi3"]
t_lo  = ["cli_temp_lo1",  "cli_temp_lo2",  "cli_temp_lo3"]
h_lo  = ["cli_rh_lo1",    "cli_rh_lo2",    "cli_rh_lo3"]
t_cs  = ["cli_temp_cs1",  "cli_temp_cs2",  "cli_temp_cs3"]
h_cs  = ["cli_rh_cs1",    "cli_rh_cs2",    "cli_rh_cs3"]
t_ext = ["cli_temp_ext1", "cli_temp_ext2", "cli_temp_ext3"]
h_ext = ["cli_rh_ext1",   "cli_rh_ext2",   "cli_rh_ext3"]
rot_limit = "cli_tooHumid_degC"

[program.out]
# One number for the house, and the two levels it came from beside it.
temp_in = "cli_temp_in"
temp_hi = "cli_temp_hi"
rh_hi   = "cli_rh_hi"
temp_lo = "cli_temp_lo"
rh_lo   = "cli_rh_lo"
temp_cs = "cli_temp_cs"
rh_cs   = "cli_rh_cs"
temp_ext = "cli_temp_ext"
rh_ext   = "cli_rh_ext"
fault_hi  = "alarm_sns_ceiling"
fault_lo  = "alarm_sns_floor"
fault_cs  = "alarm_sns_crawlspace"
fault_ext = "alarm_sns_exterior"
dew_point = "cli_dewPoint_degC"
dp_margin = "cli_dpMargin_degC"
sat_press = "cli_satPress_kPa"
vpd       = "cli_vpd_kPa"
rot       = "alarm_rot"

[[program]]
name  = "strat"
class = "StratSensor"
task  = "FAST"
stage = "sense"
health = "prog_strat"
desc  = "The stratification gap: how much warmer the ceiling is than the floor, unsigned."
notes = """
Its own program because it is a reading ABOUT two zones rather than part of
either, and because the destratification controller wants exactly one number
from it.
"""

[program.in]
ceiling = "cli_temp_hi"
floor   = "cli_temp_lo"
[program.out]
strat = "cli_dTStrat_degC"

# The interior conditions, watched. Empty run(): an alarm is an observation, and
# an observation has to keep being made while the plant is parked - which is
# exactly when someone is looking at the ALARMS page.
[[program]]
name  = "climate_watch"
class = "ClimateWatch"
task  = "SLOW"
stage = "sense"
health = "prog_climate_watch"
desc  = "The interior conditions, watched: the alarms that are a READING crossing a line rather than a law failing to hold one."
notes = """
A watch program - empty run(), everything in observe(). An alarm is an
observation, and an observation has to keep being made while the plant is
parked, which is exactly when someone is looking at the ALARMS page.

An unmeasured reading raises NOTHING here. What it raises is the zone's own
quorum alarm, which this rolls up: alarming twice for one dead probe would
make the second alarm mean "and also we cannot see".
"""

[program.in]
temp      = "cli_temp_hi"
rh        = "cli_rh_hi"
strat     = "cli_dTStrat_degC"
too_hot   = "cli_tooHot_degC"
too_cold  = "cli_tooCold_degC"
rh_cap    = "cli_rotRhCap"
strat_hi  = "cli_dTStratHigh_degC"
sns       = ["alarm_sns_ceiling", "alarm_sns_floor",
             "alarm_sns_crawlspace", "alarm_sns_exterior"]
[program.out]
hot       = "alarm_too_hot"
cold      = "alarm_too_cold"
humid     = "alarm_too_humid"
stratified = "alarm_strat"
sensor    = "alarm_sensor_fault"

[[program]]
name  = "day_phase"
class = "DayPhaseController"
task  = "SLOW"
health = "prog_day_phase"
desc  = "The day's phase, and the temperature target it puts in force."
notes = """
The phase never commands an actuator: it sets the target and the permissions,
and the ladders below decide what moves. See the spec's phase table.

The six phases are five boundaries, each declared as an offset in minutes from
sunrise or from sunset, so the whole table slides with the season instead of
being a clock an operator re-enters four times a year.
"""

[program.in]
# The house's own row, the same one the cooling ladder controls on: what the
# bank phases arm against is the interior, not one level of it.
inside        = "cli_temp_in"
# WHERE THE DAY IS, as two published offsets. The tracker is sun_watch's; this
# law is a phase table over two numbers and reads nothing else about the sky.
from_rise     = "sol_fromRise_min"
from_set      = "sol_fromSet_min"
cold_bank_trg = "cli_coldBankTrg_degC"
heat_bank_trg = "cli_heatBankTrg_degC"
# The five boundaries, each an offset in minutes from sunrise or from sunset.
cold_bank_rise = "sol_coldBankRise_min"
breeze_rise    = "sol_breezeRise_min"
day_rise       = "sol_dayRise_min"
heat_bank_set  = "sol_heatBankSet_min"
dusk_set       = "sol_duskSet_min"
night_set      = "sol_nightSet_min"
[program.out]
phase          = "cli_phase"
cold_arm       = "cli_coldBankArm"
heat_arm       = "cli_heatBankArm"

# The two extremes this law gathers AND then arms the banks against: published,
# and read back rather than kept to itself, so an operator can force one and
# rehearse a cold-bank morning in July.
[program.inout]
prev_day_max   = "cli_prevDayMax_degC"
prev_night_min = "cli_prevNightMin_degC"

[[program]]
name  = "target_temp"
class = "TargetTempController"
task  = "SLOW"
health = "prog_target_temp"
desc  = "The temperature the greenhouse is being held to: the base setting, shifted by whichever bank phase is both IN FORCE and ARMED."
notes = """
Its own program because the target is a decision, not a property of the phase:
the two bank phases only move it when yesterday justified them, and a reader
wants the number rather than the rule that produced it.
"""

[program.in]
phase         = "cli_phase"
cold_arm      = "cli_coldBankArm"
heat_arm      = "cli_heatBankArm"
cool_set      = "cli_coolSet_degC"
cold_bank_ofs = "cli_coldBankOfs_degC"
heat_bank_ofs = "cli_heatBankOfs_degC"
[program.out]
target = "cli_targetTemp_degC"

[[program]]
name  = "cooling"
class = "CoolingController"
task  = "FAST"
health = "prog_cooling"
desc  = "The cooling ladder: a PID on the interior temperature against the phase's target, published as one signed demand."
notes = """
Negative is heating - the intractors drawing warm air from under the floor,
and below that the thermal screen. The actuators spread themselves along the
demand; this program does not know which they are.
"""

# The house's ONE temperature, which temp_rh_zone has already made the worst
# case of the two levels. Read as a row rather than re-derived here, so what the
# ladder controls on is a thing an operator can watch on a page and force.
[program.in]
inside = "cli_temp_in"
# ...and the two levels behind it, for the VERDICT alone: an average carried by
# one level is still a temperature, and this law says it is working on half a
# picture rather than pretending otherwise.
ceiling = "cli_temp_hi"
floor   = "cli_temp_lo"
target = "cli_targetTemp_degC"
# What the intractors would actually deliver, and the two margins that decide
# whether drawing it is worth anything. The crawlspace IS the intake path.
intake      = "cli_temp_cs"
temp_margin = "cli_ventTempMgn_degC"
vent_hyst   = "cli_ventHyst_degC"
ground_dem  = "cli_groundHeatDem"
# The window staging, so the INTENDED opening is a row of its own: the windows
# then apply the interlocks to a published demand rather than re-deriving it.
win_start   = "cli_windowStartDem"
win_full    = "cli_windowFullDem"
kp     = "cli_coolKp"
ti     = "cli_coolTi_sec"
td     = "cli_coolTd_sec"
[program.out]
demand    = "cli_coolDem"
intake_ok = "cli_intakeCoolOk"
ground_ok = "cli_groundHeatOk"
window    = "cli_windowDem"

[[program]]
name  = "destrat"
class = "DestratController"
task  = "SLOW"
health = "prog_destrat"
desc  = "The destratification ladder: three bands with hysteresis on the ceiling-to-floor gap, published as a demand."
notes = """
A band change needs the gap to move by the declared hysteresis, so the fans do
not step between speeds on noise.
"""

[program.in]
strat = "cli_dTStrat_degC"
low   = "cli_dTStratLow_degC"
med   = "cli_dTStratMed_degC"
high  = "cli_dTStratHigh_degC"
hyst  = "cli_dTStratHyst_degC"
# The FANS' own rungs: a band here has to land in the matching band there, and
# the only way to be sure of that is to emit the number the fans compare
# against. Retuning cli_fanMedDem for the cooling ladder used to demote
# destratification speed 2 to speed 1 in silence.
fan_low  = "cli_fanLowDem"
fan_med  = "cli_fanMedDem"
fan_high = "cli_fanHighDem"
[program.out]
demand = "cli_stratDem"

# One ladder over one signal. The comfort band and the rot guard are both read
# off the dew-point margin, and splitting them made two programs that could
# disagree about what the margin was on a beat where it moved.
[[program]]
name  = "humidity"
class = "HumidityController"
task  = "SLOW"
health = "prog_humidity"
desc  = "The humidity ladder: four bands and a dead zone on the dew-point margin, published as one signed demand - and the rot guard under it."
notes = """
Negative dehumidifies (the margin is closing on condensation), positive
humidifies (the air is drier than the plants want). Set in degC rather than
kPa because it is CONDENSATION being guarded against, and that happens at the
temperature the surfaces are actually at.

The GUARD is the same signal read against a different question: the ladder's
corners are the operator's comfort band, and `cli_tooHumid_degC` is the limit
`alarm_rot` means. One program, because two reading one margin can disagree
about it on the beat it moves. The guard's two rows are published from
observe(): they command nothing, and their verdict has to stand while the
plant is parked.
"""

[program.in]
dp_margin   = "cli_dpMargin_degC"
dehum_full  = "cli_dehumFull_degC"
dehum_start = "cli_dehumStart_degC"
humid_start = "cli_humidStart_degC"
humid_full  = "cli_humidFull_degC"
rot_limit   = "cli_tooHumid_degC"
rot         = "alarm_rot"
# The dryness gate: whether the air outside would dry the greenhouse at all.
# Dew points, not humidities - a colder outside at the same RH is drier air.
in_t        = "cli_temp_hi"
in_rh       = "cli_rh_hi"
ext_t       = "cli_temp_ext"
ext_rh      = "cli_rh_ext"
dry_margin  = "cli_ventDryMgn_degC"
vent_hyst   = "cli_ventHyst_degC"
[program.out]
demand   = "cli_humidDem"
lockout  = "cli_rotLockout"
vent_dem = "cli_rotVentDem"
dry_ok   = "cli_intakeDryOk"

# The irrigation subsystem is three programs, along the seam the spec draws: a
# ladder (how thirsty the air has been), an instrument (what the two meters
# say), and the law that acts (which tray, and the valves).

[[program]]
name  = "irr_modulation"
class = "IrrigationModulation"
task  = "SLOW"
health = "prog_irr_modulation"
desc  = "The irrigation ladder: how thirsty the air has been, as one factor."
notes = """
The spec's irrigation "regulator" - evaporation in, a modulation factor out.
It commands nothing, so all of it is in observe() and it keeps folding while
the plant is parked: an outage is not a dry spell, and a hole in the average
would read as one for days afterwards.
"""

# The spec's irrigation "regulator": evaporation in, a modulation factor out.
# It never touches a valve, and it keeps folding while the plant is parked -
# an outage is not a dry spell.
[program.in]
vpd       = "cli_vpd_kPa"
dry_days  = "irr_dryEwmaDays"
dry_lo    = "irr_dryLo_kPa"
dry_hi    = "irr_dryHi_kPa"
mod_min   = "irr_modMin"
mod_gamma = "irr_modGamma"
[program.out]
vpd_avg = "irr_vpdAvg_kPa"
mod     = "irr_mod"

[[program]]
name  = "irr_meters"
class = "WaterMeters"
task  = "SLOW"
stage = "irrigation"
health = "prog_irr_meters"
desc  = "Both water meters, and the two supply faults they can see."
notes = """
Opposite ends of the same circuit and opposite instruments: the inlet is a
pulse train, so its COUNTER is the measurement and the rate is derived; the
outlet is a 4-20 mA loop, so its RATE is the measurement and the counter is.
An instrument, not a law - it drives no valve, and it reads while parked.
"""

# Both ends of the circuit, and the two supply faults they can see. Opposite
# instruments: the inlet is a pulse train whose COUNTER is the measurement, the
# outlet a 4-20 mA loop whose RATE is.
# The blocks it holds. `flow_avg` rather than `out_flow`: a block takes its
# name from what it does, and the row it filters is already called that.
[program.block]
flow_avg  = { type = "Ewma",       doc = "the loop, averaged over irr_out_avg_ms" }
flow_band = { type = "Deadband",   doc = "...and how far it must move to be written" }
in_rate   = { type = "Derivative", doc = "litres -> Lpm, over a window" }
out_meter = { type = "Integral",   doc = "Lpm -> litres" }

[program.in]
out_flow      = "irr_out_Lpm"
out_avg_ms    = "irr_out_avg_ms"
qty_per_pulse = "irr_input_qtyPerImp"
leak_Lpm      = "irr_leak_Lpm"
min_fill_Lpm  = "irr_minFill_Lpm"
state         = "irr_state"
[program.out]
in_flow      = "irr_inFlow_Lpm"
in_total     = "irr_inTotal_L"
out_flow_pub = "irr_outFlow_Lpm"
out_total    = "irr_outTotal_L"
leak         = "alarm_water_leak"
pressure     = "alarm_water_pressure"

[[program]]
name  = "irrigation"
class = "IrrigationCycle"
task  = "SLOW"
health = "prog_irrigation"
desc  = "Irrigation: one tray at a time, filled to a dose, steeped, and drained."
notes = """
FILLING -> SOAKING -> DRAINING -> FLUSHING, and a cycle is long - so only
`irr_traysPerDay` are served in a day and the surplus waits for tomorrow. The
summer settings a tray carries are its DRY-WEATHER ones; `irr_mod` scales them
down as the air gets damper, and the split decides whether that shows up as
smaller doses or rarer ones.

It holds no meter state: what went in and what came back out are both read as
published TOTALS and differenced across the window that is being judged.
"""


[program.in]
outside_temp  = "cli_temp_ext"
# The other two programs' answers: how much water this weather is worth, and
# what the meters have counted. Both are read as TOTALS and differenced, so
# this law holds no meter state of its own.
mod           = "irr_mod"
in_total      = "irr_inTotal_L"
out_total     = "irr_outTotal_L"
days   = ["irr_days_tray1","irr_days_tray2","irr_days_tray3","irr_days_tray4",
          "irr_days_tray5","irr_days_tray6","irr_days_tray7","irr_days_tray8"]
litres = ["irr_liters_tray1","irr_liters_tray2","irr_liters_tray3","irr_liters_tray4",
          "irr_liters_tray5","irr_liters_tray6","irr_liters_tray7","irr_liters_tray8"]
trays_per_day  = "irr_traysPerDay"
split          = "irr_volFreqSplit"
dawn_gate      = "irr_dawnGate_degC"
# WHEN a cycle may start: end of night, or the first hours of the day. The spec
# waters cold plants in the morning instead, never in the afternoon.
phase          = "cli_phase"
from_rise      = "sol_fromRise_min"
day_rise       = "sol_dayRise_min"
morning_win    = "irr_morningWin_min"
max_fill_s     = "irr_maxFill_sec"
soak_s         = "irr_soak_sec"
drain_window_s = "irr_drainWindow_sec"
flush_s        = "irr_flush_sec"
exp_drain      = "irr_expDrainFrac"
drain_margin   = "irr_drainMargin"
# For its QUALITY: a drain verdict needs the outlet meter to be answering, and
# the totalizer beside it is a record that stays valid whatever the loop does.
out_flow       = "irr_outFlow_Lpm"

# Read to decide when a tray is due, stamped once its fill completes - and an
# operator edits it to skip a watering or bring one forward. Shared by
# declaration, so it records no single owner.
[program.inout]
last = ["irr_last_tray1","irr_last_tray2","irr_last_tray3","irr_last_tray4",
        "irr_last_tray5","irr_last_tray6","irr_last_tray7","irr_last_tray8"]
# The two forces are ONE-SHOT, per the spec: they force or skip the NEXT
# watering of that tray, so the cycle clears them as it honours them. Read and
# written, therefore, not read alone.
force_on = ["irr_forceOn_tray1","irr_forceOn_tray2","irr_forceOn_tray3","irr_forceOn_tray4",
            "irr_forceOn_tray5","irr_forceOn_tray6","irr_forceOn_tray7","irr_forceOn_tray8"]
force_off = ["irr_forceOff_tray1","irr_forceOff_tray2","irr_forceOff_tray3","irr_forceOff_tray4",
             "irr_forceOff_tray5","irr_forceOff_tray6","irr_forceOff_tray7","irr_forceOff_tray8"]
# "Water now", which the cycle SPENDS on the cycle it started: left standing it
# would run one cycle after another for ever, slot and daily allowance ignored.
force_now   = "irr_forceNow"
# The date the schedule runs against, published and read back. Before NTP there
# is no date and nothing may be scheduled against one; forcing this row is how
# a commissioning engineer rehearses a fortnight, or a plant that never had a
# clock.
today       = "irr_today"
# What went in and what came back, published and then JUDGED on: the fill ends
# when the row says the dose has arrived and the clog is measured against the
# row beside it, so forcing either drives a cycle through without water.
delivered   = "irr_delivered_L"
drained     = "irr_drained_L"

[program.out]
tray_valve = ["irr_tray1","irr_tray2","irr_tray3","irr_tray4",
              "irr_tray5","irr_tray6","irr_tray7","irr_tray8"]
period      = "irr_period_days"
volume      = "irr_volume_L"
state       = "irr_state"
active      = "irr_activeTray"
served      = "irr_servedToday"
# TWO contactors on ONE manifold, always in the same state: there is one inlet
# and one drain, each switched twice.
inlet       = ["irr_input_ro1", "irr_input_ro2"]
outlet      = ["irr_output_ro1", "irr_output_ro2"]
fill_fault  = "alarm_irr_fill"
drain_fault = "alarm_irr_drain"
# The per-tray forms beside the "any" ones above: the any-form is what an
# operator sees on the ribbon, and these are what says which tray to go and look
# at once the cycle has moved on.
fill_tray  = ["alarm_irr_fill_tray1","alarm_irr_fill_tray2","alarm_irr_fill_tray3",
              "alarm_irr_fill_tray4","alarm_irr_fill_tray5","alarm_irr_fill_tray6",
              "alarm_irr_fill_tray7","alarm_irr_fill_tray8"]
drain_tray = ["alarm_irr_drain_tray1","alarm_irr_drain_tray2","alarm_irr_drain_tray3",
              "alarm_irr_drain_tray4","alarm_irr_drain_tray5","alarm_irr_drain_tray6",
              "alarm_irr_drain_tray7","alarm_irr_drain_tray8"]

[[program]]
name  = "screen"
class = "ScreenController"
task  = "SLOW"
health = "prog_screen"
desc  = "The thermal screen: one coil, deployed when the greenhouse is losing heat rather than gaining it."
notes = """
Two independent causes, either sufficient: the cooling ladder gone far enough
negative, or a cold night. No feedback, so travel is TIMED - and while it runs
the destratification fans are cut, because the fabric is moving through the
air they blow into.
"""

[program.in]
cool_dem     = "cli_coolDem"
deploy_dem   = "cli_thermalScreenDem"
phase        = "cli_phase"
travel_s     = "cli_screenTravel_sec"
travel_tmo_s = "cli_screenTmo_sec"

[program.out]
screen = "cli_screen"
moving = "cli_screenMoving"

[[program]]
name  = "windows"
class = "WindowsController"
task  = "SLOW"
health = "prog_windows"
desc  = "The four roof windows: one target from the cooling ladder, and ONE MOVING AT A TIME."
notes = """
The one-at-a-time rule is electrical, so a safety cannot break it either: a
rain interlock shuts them in sequence, not together. A window keeps the bus
until its stroke ends, which is also what stops a target changing mid-travel
from handing the bus to the next window and leaving a coil energised.

The humidity demand is not read. Anti-dryness would ask them shut and the spec
is explicit that cooling wins over it; with no cooling demand the target is 0
and they are shut regardless, so absence is the rule rather than a merge.
Taking a MINIMUM of the two was proposed and rejected: it inverts exactly the
dry-and-hot case.
"""


# The humidity demand is deliberately absent. Anti-dryness would ask the
# windows shut, and the spec is explicit that cooling wins over it - "l'air sec
# ne met pas les Hawortia en danger, mais la chaleur oui". With no cooling
# demand the target is 0 and they are shut anyway, so absence IS the rule.
[program.in]
# The INTENDED opening, laddered by the cooling law that owns the demand. This
# program's job is the interlocks and the rams, not the staging.
window_dem  = "cli_windowDem"
rain_mmph   = "cli_rain_mmph"
wind_mps    = "cli_wind_mps"
gust_mps    = "cli_windGust_mps"
wind_shut   = "cli_windShut_mps"
rain_hold_s = "cli_rainLockout_sec"
travel_s    = "cli_windowTravel_sec"
tmo_s       = "cli_windowTmo_sec"
supply_lock = "sys_supply_lockout"

# The two lockouts this law derives AND then obeys: it publishes what the
# instruments say, and shuts the roof on what the ROW reads back. An operator
# forcing one is the point - a lockout nobody can override is a lockout nobody
# can test, and one the law ignored would be a lie on the page.
[program.inout]
rain_lock   = "cli_rainLockout"
wind_lock   = "cli_windLockout"
# ...and their verdict, published and then obeyed the same way: one row an
# operator can force to hold the roof shut without inventing weather.
window_lock = "cli_windowLockout"

[program.out]
opn = ["cli_window1_opn","cli_window2_opn","cli_window3_opn","cli_window4_opn"]
clo = ["cli_window1_clo","cli_window2_clo","cli_window3_clo","cli_window4_clo"]
tgt = ["cli_window1_tgt","cli_window2_tgt","cli_window3_tgt","cli_window4_tgt"]
pos = ["cli_window1_pos","cli_window2_pos","cli_window3_pos","cli_window4_pos"]

[[program]]
name  = "weather_watch"
class = "WeatherWatch"
task  = "SLOW"
stage = "sense"
health = "prog_weather_watch"
desc  = "The weather station, watched: whether it is answering, and whether what it says is a storm."
notes = """
A storm IS what shuts the roof, so this reads `WindowsController`'s two
lockouts rather than declaring a second pair of thresholds beside them - an
alarm that disagreed with the actuator it is about would be worse than no
alarm.
"""

[program.in]
wind      = "cli_wind_mps"
gust      = "cli_windGust_mps"
rain      = "cli_rain_mmph"
irrad     = "cli_irrad_Wpm2"
rain_lock = "cli_rainLockout"
wind_lock = "cli_windLockout"
[program.out]
station    = "alarm_wx_station"
storm      = "alarm_weather_storm"
since_rain = "cli_sinceRain_min"

[[program]]
name  = "intractors"
class = "IntractorController"
task  = "SLOW"
health = "prog_intractors"
desc  = "The two intractors: variable-speed fans drawing air from under the floor, driven by whichever of three demands wants the most."
notes = """
Both run together at one speed - they serve one volume - and the fusion is a
MAXIMUM, so each input is a floor rather than a share. The ramp runs between
the two staging thresholds, so the windows below it and the intractors above
it hand over rather than overlap.
"""


# Three FLOORS, per the spec's fusion: whichever wants the most air gets it.
# The humidity demand contributes its DEHUMIDIFY arm only - the other way it is
# asking for the skirt, which is not this device.
[program.in]
cool_dem  = "cli_coolDem"
rot_vent  = "cli_rotVentDem"
humid_dem = "cli_humidDem"
ground_speed = "cli_groundSpeed"
start_dem = "cli_intakeStartDem"
full_dem  = "cli_intakeFullDem"
# The three gates, each decided by the law that owns the reading behind it: a
# demand whose gate is shut contributes nothing to the maximum.
cool_ok   = "cli_intakeCoolOk"
ground_ok = "cli_groundHeatOk"
dry_ok    = "cli_intakeDryOk"

[program.out]
intr = ["cli_intr1","cli_intr2"]

[[program]]
name  = "fans"
class = "FanController"
task  = "SLOW"
health = "prog_fans"
desc  = "The two destratification fans: three relayed speeds, driven by whichever of three demands wants the most."
notes = """
The speed relays are exclusive - one contactor per speed on one motor - and
the band the fused demand falls in decides which. That band has its own
hysteresis: the inputs are floors, so the winner changes as the plant does,
and the fans would step between speeds every time it did.

The screen cuts them outright while it travels: the fabric moves through the
air they blow into.
"""

[program.in]
strat_dem     = "cli_stratDem"
cool_dem      = "cli_coolDem"
irr_state     = "irr_state"
screen_moving = "cli_screenMoving"
low_dem       = "cli_fanLowDem"
med_dem       = "cli_fanMedDem"
high_dem      = "cli_fanHighDem"
# The two BREEZES are the fans' business: a light circulation at dusk dries the
# leaves before the stomata open, and at dawn it takes the night's condensation
# off them. The phase asks; this is how much.
phase         = "cli_phase"
breeze_dem    = "cli_breezeDem"

[program.out]
speed1 = ["cli_destrat1_speed1","cli_destrat2_speed1"]
speed2 = ["cli_destrat1_speed2","cli_destrat2_speed2"]
speed3 = ["cli_destrat1_speed3","cli_destrat2_speed3"]
# The band itself, published: three coils are three facts, and what an operator
# wants is the one number they add up to.
band   = "cli_fanSpeed"

[[program]]
name  = "skirt"
class = "SkirtController"
task  = "SLOW"
stage = "actuators"
health = "prog_skirt"
desc  = "The wet skirt: one valve pulsed against two demands."
notes = """
It is the humidifier, and it tracks the humidify arm PROPORTIONALLY - the
effort is the on-time within a period. It is also an evaporative cooler, and
on that axis it is STAGED, above cli_skirtCoolDem and only while the air is
dry enough for a wet pad to cool anything at all.

The rot lockout cuts it outright. Wetting air that is already condensing is
the one thing this valve must never do.
"""

# `pulse` rather than `valve`: the ROW is the coil, and the block is the pulse
# train that decides when it is energised. A block needing more than a type
# takes a table of its own - an inline one cannot be split over two lines.
[program.block.pulse]
type    = "ValveController"
include = "blocks/valve_controller.h"
doc     = "the on-time within a period"

[program.in]
cool_dem   = "cli_coolDem"
humid_dem  = "cli_humidDem"
cool_start = "cli_skirtCoolDem"
dry_min    = "cli_skirtDryMin_degC"
dp_margin  = "cli_dpMargin_degC"
rot_lock   = "cli_rotLockout"
period_s   = "cli_skirtPeriod_sec"
min_on_s   = "cli_skirtMinOn_sec"

[program.out]
valve = "cli_skirtValve"
duty  = "cli_skirtDuty"
