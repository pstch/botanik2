# gh_mlb41 - the site's identity, its tuning and what it turns on.
#
# The one file that is not a table. `scripts/tables.py config` turns it into
# generated/config.gen.h; the tables beside it produce everything else.

[site]
name = "gh_mlb41"

[rates]
# The site's control programs, in ms. A greenhouse is a slow plant: the fastest
# thing any law reacts to is a window ram, which takes tens of seconds to
# travel. `sense` is the conditioning chain, finer so the filters see an even
# sample interval.
control = 100
sense   = 10

[limits]
# Rows the bank can hold, plus headroom. Past it registration is refused and
# the POST says so. About 36 bytes of RAM each.
var_max = 704
# The TCP map holds every parameter, status and alarm row. A site that outgrows
# it serves a SHORT map, which an integrator reads as a device that does not
# have those rows. The gate asserts the real count against this.
modbus_tcp_max_rows = 576
# Names, units and descriptions share one pool, sized once for the whole table.
str_pool_bytes = 512

[registers]
# Where the generated `_qlt` companions start. Their own block, above every
# hand-assigned register, so adding a reading cannot renumber one. They are
# handed out in emission order: appending an input appends a register.
quality_base = 1000

[fieldbus]
# RS-485. Every device on the segment has to agree.
baud = 38400

[build]
# Pin the footprints, so a change that moves them has to say so.
pin_sizes = true

[features]
# Everything this site turns on. Dependencies are the LIBRARY's - the generator
# reads them from the `#error` rules in libbotanik_features.h and nests the
# guards accordingly, so a page is not forced on when the console is off.
#
# The generated guard is `#if !defined(X) || X`, which means "unless explicitly
# turned off": precedence stays command line > site > header default.
LOGS_PAGE         = true
ALARMS_PAGE       = true
PARAMS_PAGE       = true
MONITOR_PAGE      = true
TASKS_PAGE        = true
SYSTEM_PAGE       = true
NOTES_PAGE        = true
LOGS_MONITOR      = true
NETWORK           = true
NTP               = true
MQTT              = true
LOGS_PUBLISH      = true
ALARMS_PUBLISH    = true
MODBUS_TCP_SERVER = true
MODBUS_TCP_CLIENT = true
MODBUS_RTU_CLIENT = true
MODBUS_RTU_SERVER = true
SUN_TRACKER       = true
